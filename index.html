 giống sai, khẩu phần thiếu protein/lysine, stress nhiệt, phối giống sai thời điểm rụng trứng (24-36h sau mê ì).",trieuChung:["Chọn nái: 6 vú trở lên, ngoại hình cân đối, chân thẳng","Phối giống: mê ì đứng yên khi đè lưng, âm hộ đỏ, dịch nhầy trong","Mang thai 114 ngày: chia 3 giai đoạn – 0-30 ngày giảm ăn, 30-90 ngày tăng 0.3kg/ngày, 90-114 ngày tăng 0.5kg/ngày + ADE","Tỷ lệ đậu thai thấp nếu phối quá sớm/muộn, số con đẻ/lứa giảm"],benhTich:["Buồng trứng kém phát triển nếu thiếu dinh dưỡng","Niêm mạc tử cung mỏng, thai kém bám"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Bổ sung ADE + Selen 5 ngày trước phối","Trợ sức Gluco K-C + men tiêu hóa Biozyme","Cho ăn 2.5-3kg/ngày cuối thai kỳ + rau xanh"],icovet:["ICOVET: Gonadorelin 2ml/nái kích rụng trứng khi mê ì","Catophos + B12 10ml sau đẻ"],hanoi:["Theo Hà Nội + Thái Nguyên: Phác đồ tăng lực Catophos + B12 10ml/nái 3 ngày liên tục","Không phối quá sớm, ghi chép phối giống, chuồng đẻ khô ấm 28-30°C"]}),phongNgua:["Chọn hậu bị 8 tháng 120kg, tiêm vaccine Parvo, Lepto, PRRS trước phối 4 tuần","Ghi chép phối giống, không phối quá sớm","Vệ sinh chuồng đẻ khô ấm, lót rơm, sát trùng iod"]}},{id:"hn2",subId:"heo-nai",group:"heo",name:"Viêm tử cung MMA (Viêm vú - viêm tử cung - mất sữa)",sections:{gioiThieu:"Hội chứng MMA thường gặp 12-48h sau đẻ, nguy hiểm cho cả nái và heo con, tỷ lệ mắc 15-25% nếu vệ sinh kém.",nguyenNhan:"E.coli, Klebsiella, Strep xâm nhập tử cung sau đẻ khó, sót nhau, can thiệp đẻ không vô trùng, chuồng ẩm ướt.",trieuChung:["Sốt 40-41°C, bỏ ăn hoàn toàn","Vú sưng nóng đỏ, đau, sữa ít hoặc mất hẳn, sữa loãng vàng","Dịch âm hộ mủ trắng vàng hôi thối, sản dịch kéo dài >5 ngày"],benhTich:["Tử cung xung huyết, chứa mủ","Vú viêm, tuyến sữa tắc bã đậu","Hạch bẹn sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• KHÔNG nặn vú mạnh gây vỡ tuyến","• Oxytocin 20UI bắp + Gentamycin 4mg/kg + Dexamethasone 0.2mg/kg","• Thụt rửa tử cung bằng Iodine 0.5% ấm 500ml, sau đó đặt viên kháng sinh tử cung","• Truyền Gluco 5% + Cafein nếu sốt cao"],icovet:["ICOVET - MMA-Care: Amoxi LA 15mg/kg + Ketoprofen 3mg/kg 3 ngày","Bổ sung Gluco K-C + Vitamin C"],hanoi:["Theo Hà Nội + Thái Nguyên: Phác đồ tương tự, tăng liều trợ sức, truyền dịch, tiêm Amoxi + Gentamycin kết hợp"]}),phongNgua:["Tiêm Amoxi LA phòng 1 mũi sau đẻ 6h","Chuồng đẻ sát trùng Virkon, lót khô, không để phân tồn","Can thiệp đẻ phải găng tay vô trùng + gel bôi trơn"]}},{id:"hn3",subId:"heo-nai",group:"heo",name:"Tắc tia sữa",sections:{gioiThieu:"Tắc ống dẫn sữa do viêm cục bộ, sữa đặc vón cục, thường 1-2 vú, không sốt toàn thân.",nguyenNhan:"Viêm vú nhẹ không điều trị, nái ít cho con bú do heo con yếu, sữa quá đặc do thiếu nước uống.",trieuChung:["Một vài vú căng cứng, nóng nhẹ, heo con tranh bú vú khác kêu la","Sữa vón cục, ít, màu vàng","Nái vẫn ăn nhưng giảm"],benhTich:["Ống dẫn sữa tắc bã đậu trắng","Tuyến sữa viêm nhẹ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Chườm ấm 40°C 10 phút + massage nhẹ từ trên xuống + Oxytocin 10UI bắp","Kháng sinh Pen-Strep 1ml/10kg 3 ngày","Cho heo con khỏe bú vú tắc để thông"],icovet:["Kết hợp kháng viêm Meloxicam 0.4mg/kg"],hanoi:["Theo Hà Nội + Thái Nguyên: Bổ sung nước điện giải tự do, tăng rau xanh, giảm tinh bột"]}),phongNgua:["Cho heo con bú đều các vú, đảo vú ngày 1-2","Đủ nước uống 20-30 lít/ngày, chuồng mát"]}},{id:"hn4",subId:"heo-nai",group:"heo",name:"Bại liệt Canxi (Sốt sữa) sau đẻ",sections:{gioiThieu:"Rối loạn Canxi huyết cấp sau đẻ 1-3 ngày, nái nuôi con nhiều sữa, hay gặp nái lứa 3-5.",nguyenNhan:"Hạ Canxi máu <8mg% do huy động không kịp cho tiết sữa, khẩu phần mất cân đối Ca:P, thiếu Vitamin D3.",trieuChung:["Nái nằm nghiêng, run cơ, không đứng dậy được, cố đứng rồi ngã","Mắt trợn, tai lạnh, sốt nhẹ 39.5°C rồi hạ nhiệt 37.5°C","Mất phản xạ, nếu không cấp cứu chết sau 12-24h"],benhTich:["Không có bệnh tích đặc trưng, máu loãng, đông chậm"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Tiêm chậm tĩnh mạch tai Calcium gluconate 10% 100-150ml + 20ml Glucose 20% pha ấm","• Theo dõi tim, nếu tim đập nhanh ngừng tiêm","• Trợ tim Cafein 5ml bắp, giữ ấm","• Sau tỉnh cho uống nước đường + ADE"],icovet:["Calci-B12 Forte 20ml bắp 2 ngày liên tiếp","Vitamin D3 ADE 5ml"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ ấm, lật trở chống loét, xoa bóp chân, bổ sung Vitamin D3, không vỗ béo quá trước đẻ"]}),phongNgua:["Bổ sung Canxi hữu cơ + Vitamin D3 cuối thai kỳ 90-114 ngày","Không vỗ béo quá mức trước đẻ, cho vận động nhẹ"]}},{id:"hn5",subId:"heo-nai",group:"heo",name:"Parvo sảy thai truyền nhiễm",sections:{gioiThieu:"Virus Parvovirus type 1 gây sảy thai khô, thai gỗ, đẻ ít con, SMEDI syndrome.",nguyenNhan:"Parvovirus heo type 1, lây qua phân, nước tiểu, tinh dịch, tồn tại môi trường 6 tháng. Nái tơ nhiễm lần đầu nặng nhất.",trieuChung:["Nái mang thai 70-90 ngày sảy thai khô, thai gỗ đen, miêu ướp xác, kích thước khác nhau (lứa thai chết nhiều thời điểm)","Đẻ ít con 3-5 con, thai gỗ lẫn con sống","Đẻ lại giống kéo dài, chu kỳ động dục không đều"],benhTich:["Thai gỗ, phù, xuất huyết da thai, gan hoại tử","Thai chết khô đen, ướp xác"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• KHÔNG có thuốc đặc trị virus","• Biện pháp: Loại nái đẻ kém <6 con 2 lứa liên tiếp, vệ sinh tinh dịch, kiểm tra tinh","• Kháng sinh chống kế phát Amoxi LA","• Tăng đề kháng Vitamin ADE + Selen"],icovet:["Tiêm vaccine Parvo 2 lần trước phối 4 và 2 tuần, lặp lại mỗi 6 tháng","Vệ sinh chuồng, phun Virkon"],hanoi:["Theo Hà Nội + Thái Nguyên: Phác đồ tương tự, tăng cường ADE + Selen, quản lý đàn hậu bị"]}),phongNgua:["Vaccine Parvo định kỳ hậu bị trước phối","Kiểm soát chuột, côn trùng, không nhập tinh không rõ nguồn, cách ly nái mới 30 ngày"]}},{id:"hc1",subId:"heo-con",group:"heo",name:"Tiêu chảy Clostridium heo con 1-7 ngày",sections:{gioiThieu:"Heo con 1-7 ngày tuổi tiêu chảy phân vàng nâu lẫn bọt, chết nhanh do độc tố beta.",nguyenNhan:"Clostridium perfringens type A, C nhiễm từ phân mẹ, nền chuồng bẩn, không sát trùng.",trieuChung:["Phân vàng nâu sủi bọt, mùi khắm thối, dính đít","Bụng chướng, heo con kêu la, bú kém","Chết cấp sau 12-24h tiêu chảy, tỷ lệ chết 30-50%"],benhTich:["Ruột non xuất huyết, hoại tử, chứa bọt khí","Gan sưng, lách to","Ruột già chứa phân vàng"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• KHÔNG lạm dụng kháng sinh uống sớm gây loạn khuẩn","• Ampicoli 1ml/5kg thể trọng uống 3 ngày + men sống Lacto","• Truyền điện giải Gluco K-C + Atropin 0.1ml nếu mất nước nặng","• Giữ ấm 32-34°C"],icovet:["Toltrazuril + Amoxi phòng cầu trùng ghép","Phun Neopredisan sát trùng"],hanoi:["Theo Hà Nội + Thái Nguyên: Vệ sinh chuồng đẻ bằng vôi + khò gas, thay chất độn khô, tiêm sắt + Amoxi cho nái"]}),phongNgua:["Vaccine Clostridium cho nái 6 và 3 tuần trước đẻ","Chuồng khô, ấm 32-34°C, sát trùng chuồng đẻ trước đẻ 3 ngày"]}},{id:"hc2",subId:"heo-con",group:"heo",name:"E.coli phù đầu sưng mặt",sections:{gioiThieu:"Bệnh phù đầu do E.coli độc tố Shiga, heo cai sữa 5-14 ngày, chết nhanh, tỷ lệ chết 50-90%.",nguyenNhan:"E.coli K88, F18, O139, O141 sản sinh verotoxin, stress cai sữa, đổi cám đột ngột, ăn quá nhiều đạm.",trieuChung:["Phù mí mắt, phù đầu to, tiếng kêu khàn, đi loạng choạng, liệt","Co giật, nằm nghiêng bơi chèo","Tiêu chảy nhẹ hoặc táo, chết trong 24h sau phù"],benhTich:["Dạ dày, ruột, mạc treo phù keo nhầy trong suốt","Mí mắt phù, não phù","Hạch màng treo sưng mọng nước"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Giảm 50% cám ngay, tăng xơ, cho ăn cháo loãng","• Colistin 10mg/kg + Enro 10% 1ml/10kg + hạ sốt Ketoprofen","• Trợ sức Vitamin C + Gluco K-C","• Biện pháp: không ép ăn, cho uống điện giải tự do"],icovet:["Phác đồ: Apramycin + Dexamethasone nhẹ 0.2mg/kg 1 lần","Acid hữu cơ + kẽm oxit 3000ppm"],hanoi:["Theo Hà Nội + Thái Nguyên: Cho uống điện giải tự do, không ép ăn, giữ ấm, giảm stress cai sữa"]}),phongNgua:["Không đổi cám đột ngột khi cai sữa, chuyển cám từ từ 7 ngày","Bổ sung kẽm oxit 2500-3000ppm, axit hữu cơ, men tiêu hóa, giảm đạm 18-19% tuần đầu cai sữa"]}},{id:"hc3",subId:"heo-con",group:"heo",name:"PED tiêu chảy cấp 100% đàn con theo mẹ",sections:{gioiThieu:"Coronavirus PEDv gây tiêu chảy cấp 100% đàn con theo mẹ, heo <7 ngày chết 80-100%.",nguyenNhan:"PED virus, lây phân-miệng, tốc độ lây cực nhanh qua người, xe, chuột, chim. Virus tồn tại phân 2 tuần.",trieuChung:["Nôn ói dữ dội, sau đó tiêu chảy nước vàng bắn vọt, phân toàn nước","Heo con mất nước nhanh, mắt trũng, da nhăn, nằm chồng đống","Nái có thể tiêu chảy nhẹ, giảm sữa","Chết 80-100% heo <7 ngày sau 3-5 ngày"],benhTich:["Ruột non mỏng trong suốt như giấy bóng, chứa dịch vàng, thành ruột teo nhung mao","Dạ dày đầy sữa không tiêu vón cục","Ruột già chứa dịch vàng"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• KHÔNG có thuốc đặc trị virus","• Biện pháp feedback: Cho nái ăn phân + ruột con bệnh xay nhỏ (5g/nái) để tạo kháng thể sữa đầu, làm 2 lần cách 3 ngày","• Giữ ấm 35°C, đèn hồng ngoại 24/24","• Bù điện giải Oresol + Gluco K-C + men + Atropin chống nôn"],icovet:["Phun sát trùng Virkon 1/100 ngày 2 lần, all in-all out, ủ phân 60 ngày, không bán chạy"],hanoi:["Theo Hà Nội + Thái Nguyên: Kháng sinh chống bội nhiễm Gentamycin + Atropin, giữ ấm, giảm mật độ, cách ly triệt để"]}),phongNgua:["An toàn sinh học 5 lớp, ủng riêng, ủ phân 60 ngày","Vaccine PED cho nái 6 và 3 tuần trước đẻ (vaccine chết)","Không nhập heo, xe phải sát trùng"]}},{id:"hc4",subId:"heo-con",group:"heo",name:"Cầu trùng heo con Isospora suis",sections:{gioiThieu:"Isospora suis gây tiêu chảy dai dẳng 7-21 ngày tuổi, phân vàng xám không tanh, chậm lớn.",nguyenNhan:"Isospora suis, chuồng ẩm, phân không dọn, oocyst tồn tại môi trường 1 năm, đề kháng sát trùng thường.",trieuChung:["Phân vàng xám, nhão, sền sệt, không tanh, bết đít","Lông xù, gầy, bú kém, chậm lớn, còi cọc","Tiêu chảy 5-7 ngày rồi tự hết nhưng tái lại"],benhTich:["Ruột non viêm catarr, xuất huyết điểm, nhung mao teo ngắn","Hạch màng treo sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Toltrazuril 20mg/kg uống 1 lần lúc 3-5 ngày tuổi (Baycox 5% 1ml/con) hiệu quả nhất","Sulfadimidine 30mg/kg 3 ngày nếu không có Toltrazuril","Bù điện giải + men"],icovet:["Baycox 5% 1ml/con uống 1 lần duy nhất lúc 3-5 ngày tuổi","Sát trùng bằng Neopredisan mới diệt được oocyst"],hanoi:["Theo Hà Nội + Thái Nguyên: Vệ sinh khô, thay chất độn, khò chuồng bằng gas 80°C, để khô 2 ngày"]}),phongNgua:["Phun Neopredisan 1% 0.5 lít/m2, để khô 2 ngày mới thả nái","Không để phân tồn >24h, dọn phân ngày 2 lần, giữ khô, ấm"]}},{id:"hc5",subId:"heo-con",group:"heo",name:"Viêm khớp Glasser (Haemophilus parasuis)",sections:{gioiThieu:"Haemophilus parasuis gây viêm đa xoang, viêm khớp, viêm màng não, heo cai sữa 4-8 tuần.",nguyenNhan:"Glasser, stress cai sữa, lạnh, ghép đàn, Mycoplasma + PRRS làm nặng thêm.",trieuChung:["Sốt 40.5-41.5°C, ho nhẹ, thở khó","Sưng khớp gối, khuỷu, đi khập khiễng, nằm không đứng","Viêm màng não: nghiêng đầu, run, co giật","Chết 10-20% nếu không điều trị sớm"],benhTich:["Màng phổi, màng tim, màng bụng phủ fibrin vàng như bơ","Khớp sưng chứa dịch vàng, fibrin","Màng não xung huyết"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Ceftiofur 3mg/kg + Dexamethasone 0.2mg/kg 3 ngày, sau đó Amoxi LA 15mg/kg","Hạ sốt Ketoprofen, Gluco K-C","Lót chuồng mềm rơm"],icovet:["Vaccine Glasser 2 lần lúc 7 và 21 ngày","Tulathromycin 1 liều"],hanoi:["Theo Hà Nội + Thái Nguyên: Giảm stress cai sữa, không ghép đàn, giữ ấm, thông thoáng"]}),phongNgua:["Vaccine Glasser, kháng sinh phòng 3 ngày đầu cai sữa bằng Ceftiofur hoặc Amoxi","Giảm stress, không lạnh, all in-all out"]}},{id:"hc6",subId:"heo-con",group:"heo",name:"Suyễn Mycoplasma hyopneumoniae heo con",sections:{gioiThieu:"Mycoplasma gây ho khan kéo dài, giảm tăng trọng, heo 4-12 tuần, ghép PRRS, Pasteurella nặng.",nguyenNhan:"Mycoplasma hyopneumoniae, lây qua không khí, bụi, tiếp xúc, tồn tại chuồng 2 tuần.",trieuChung:["Ho khan lúc sáng sớm và chiều tối, ho từng tràng, ho khi lùa","Thở nhanh, thở bụng nhẹ, sốt nhẹ","Chậm lớn, lông xù, còi, tỷ lệ đồng đều kém"],benhTich:["Phổi gan hóa thùy đỉnh, thùy tim, màu tím xám, chắc như thịt","Hạch phế quản sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tilmicosin trộn 300ppm 15 ngày liên tục + Bromhexin long đờm","Hoặc Tulathromycin 2.5mg/kg tiêm 1 liều duy nhất","Florfenicol 15mg/kg + Doxy 10mg/kg 5 ngày nếu ghép"],icovet:["Vaccine Myco lúc 7 và 21 ngày (M+Pac, Respisure)","Tăng thông thoáng"],hanoi:["Theo Hà Nội + Thái Nguyên: Giảm bụi, phun sát trùng nhẹ, giảm mật độ, tăng thoáng, vaccine Myco"]}),phongNgua:["Vaccine Mycoplasma 2 lần, thông thoáng, giảm bụi, giảm mật độ, không để lạnh, all in-all out"]}},{id:"hc7",subId:"heo-con",group:"heo",name:"Tiêu chảy do Rotavirus heo con",sections:{gioiThieu:"Rotavirus A,B,C gây tiêu chảy nước vàng ở heo 1-4 tuần, ít chết nhưng chậm lớn, dễ ghép E.coli.",nguyenNhan:"Rotavirus, lây phân-miệng, tồn tại môi trường 2 tháng, heo con thiếu kháng thể sữa đầu dễ mắc.",trieuChung:["Tiêu chảy nước vàng, nôn ít, phân lỏng toàn nước, không máu","Mất nước vừa, mắt hơi trũng, heo vẫn bú nhưng kém","Tự khỏi sau 3-5 ngày nhưng tái lại nếu ghép E.coli"],benhTich:["Nhung mao ruột teo ngắn, ruột mỏng, chứa dịch vàng","Dạ dày chứa sữa không tiêu"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Bù nước điện giải Oresol + men tiêu hóa Lactobacillus + Gluco K-C","Kháng sinh nhẹ Amoxi + Colistin chống bội nhiễm E.coli","Giữ ấm 32°C"],icovet:["Dùng kháng thể E.coli-Rota uống phòng 3 ngày đầu","Vaccine Rota cho nái"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ ấm, giảm mật độ, vệ sinh khô, không để phân tồn"]}),phongNgua:["Vệ sinh, sát trùng, vaccine Rota cho nái 5 và 2 tuần trước đẻ","Cho bú sữa đầu đủ trong 6h đầu, giữ ấm"]}},{id:"ht1",subId:"heo-thit",group:"heo",name:"Dịch tả heo Châu Phi ASF",sections:{gioiThieu:"Bệnh virus nguy hiểm nhất, tỷ lệ chết 100%, không có vaccine thương mại hiệu quả, bắt buộc tiêu hủy.",nguyenNhan:"ASF virus DNA, lây qua thịt, ve mềm Ornithodoros, người, xe, chuột, chim. Virus sống trong thịt đông lạnh 1000 ngày.",trieuChung:["Sốt cao 41-42°C, bỏ ăn hoàn toàn, nằm chồng đống","Da đỏ tím tai, bụng, bẹn, nách, mũi, chân","Nôn, tiêu chảy máu hoặc táo, khó thở","Chết nhanh 3-7 ng  hóa"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Ceftiofur 3mg/kg + Ketoprofen 3mg/kg 3-5 ngày, hoặc Tulathromycin 2.5mg/kg 1 liều","Bromhexin long đờm + Gluco K-C","Giảm mật độ, tăng thoáng"],icovet:["Phác đồ APP-Stop: Florfenicol 20mg/kg + Doxy 10mg/kg 7 ngày trộn cám","Vaccine APP"],hanoi:["Theo Hà Nội + Thái Nguyên: Giảm mật độ, vaccine APP, thông thoáng, giảm NH3"]}),phongNgua:["Vaccine APP 2 lần lúc 6 và 9 tuần, thông thoáng, giảm mật độ, giảm bụi, NH3 <20ppm, không lạnh"]}},{id:"ht7",subId:"heo-thit",group:"heo",name:"Tụ huyết trùng Pasteurella",sections:{gioiThieu:"Pasteurella multocida type A, D gây sốt, khó thở cấp, heo thịt 2-6 tháng, chết cấp nếu không điều trị sớm.",nguyenNhan:"Pasteurella, stress vận chuyển, lạnh, ghép Myco, PRRS, bụi cao.",trieuChung:["Sốt 41°C, thở khó, há mồm, mũi chảy mủ vàng, ho","Bỏ ăn, nằm, tím tai nếu nặng","Chết cấp trong 24h nếu thể quá cấp"],benhTich:["Phổi gan hóa đỏ, xuất huyết, chứa mủ","Hạch phổi sưng, xoang mũi mủ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Enrofloxacin 10% 1ml/20kg + Bromhexin 0.5ml/10kg 3-5 ngày","Hoặc Ceftiofur 3mg/kg + Ketoprofen","Hạ sốt Paracetamol + Gluco K-C"],icovet:["Tulathromycin 2.5mg/kg 1 lần duy nhất hiệu quả cao","Vaccine tụ huyết trùng"],hanoi:["Theo Hà Nội + Thái Nguyên: Tăng thoáng, giảm bụi, tiêm phòng tụ huyết trùng 2 lần/năm"]}),phongNgua:["Vaccine tụ huyết trùng 2 lần/năm (vaccine chết), thông thoáng, giảm bụi, giảm mật độ, không lạnh"]}},{id:"ht8",subId:"heo-thit",group:"heo",name:"Phó thương hàn Salmonella choleraesuis",sections:{gioiThieu:"Salmonella gây sốt, tiêu chảy vàng xám, tím da, gầy còm, heo thịt 2-4 tháng, lây qua phân, chuột.",nguyenNhan:"Salmonella choleraesuis, typhisuis, lây qua phân, nước, chuột, chim, tồn tại chuồng 3 tháng.",trieuChung:["Sốt 40.5-41.5°C, bỏ ăn, tiêu chảy vàng xám, có máu, mùi thối","Tím tai, bụng, da","Gầy còm, lông xù, chết 10-20% nếu ghép"],benhTich:["Gan sưng to, lách to, ruột viêm hoại tử, có nốt loét cúc áo","Hạch màng treo sưng to"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Florfenicol 20mg/kg + Doxycyclin 10mg/kg 5-7 ngày trộn cám","Điện giải + men tiêu hóa + Gluco K-C","Diệt chuột, vệ sinh nước uống"],icovet:["Trộn thức ăn Apramycin 100ppm + Neomycin 150ppm 7 ngày","Tulathromycin"],hanoi:["Theo Hà Nội + Thái Nguyên: Vệ sinh nước uống, diệt chuột, ủ phân, vaccine Salmonella"]}),phongNgua:["Vaccine Salmonella (Salmonella chết) 2 lần/năm, ủ phân 60 ngày, diệt chuột, vệ sinh nước uống, không cho ăn thức ăn ôi"]}},{id:"ht9",subId:"heo-thit",group:"heo",name:"Đóng dấu Erysipelas (Erysipelothrix rhusiopathiae)",sections:{gioiThieu:"Vi khuẩn Erysipelothrix gây sốt cao, dấu da hình thoi đỏ tím, viêm khớp, viêm van tim, heo thịt 3-12 tháng.",nguyenNhan:"Erysipelothrix rhusiopathiae, tồn tại đất 6 tháng, lây qua vết trầy, phân, nước tiểu, chuột.",trieuChung:["Sốt cao 42°C, bỏ ăn, nằm, da nổi dấu đỏ tím hình thoi, vuông, hơi gồ lên, ấn mất màu","Viêm khớp: sưng khớp gối, què","Thể mãn: viêm van tim sùi, chết đột ngột"],benhTich:["Lách to, thận xuất huyết, van tim sùi như súp lơ","Khớp sưng mủ, da dấu thoi"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Penicillin G liều cao 20.000 UI/kg 2 lần/ngày 3-5 ngày hiệu quả nhất","Hoặc Amoxi LA 15mg/kg + Ketoprofen","Hạ sốt + Gluco K-C"],icovet:["Amoxi LA 15mg/kg 3 ngày liên tiếp","Vaccine đóng dấu"],hanoi:["Theo Hà Nội + Thái Nguyên: Vệ sinh, sát trùng, vaccine đóng dấu 2 lần/năm"]}),phongNgua:["Vaccine đóng dấu (Erysipelas) 2 lần/năm, vệ sinh chuồng, diệt chuột, không để trầy xước, sát trùng vết thương"]}},{id:"ht10",subId:"heo-thit",group:"heo",name:"Lepto xoắn khuẩn vàng da",sections:{gioiThieu:"Leptospira pomona, icterohaemorrhagiae gây sảy thai muộn, vàng da, thận trắng đốm, heo mọi lứa tuổi.",nguyenNhan:"Leptospira, lây qua nước tiểu, nước ao tù, chuột, tồn tại nước 2 tháng. Người cũng nhiễm.",trieuChung:["Sốt 40-41°C, vàng da, vàng mắt, tiểu đỏ, sảy thai muộn 2-3 tuần cuối thai kỳ","Nái sảy thai, heo con yếu, chết","Heo thịt: sốt, vàng da, bỏ ăn"],benhTich:["Thận trắng đốm, sưng to, có điểm trắng","Gan vàng, sưng, túi mật to","Phổi phù"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Streptomycin 25mg/kg + Penicillin G 20.000 UI/kg 5 ngày","Hoặc Amoxi LA liều cao 20mg/kg + Gluco K-C + truyền dịch","Bổ sung Vitamin C + giải độc gan"],icovet:["Amoxi LA liều cao 20mg/kg 5 ngày","Diệt chuột, vệ sinh nước"],hanoi:["Theo Hà Nội + Thái Nguyên: Cách ly, vệ sinh nước uống, diệt chuột, vaccine Lepto"]}),phongNgua:["Vaccine Lepto 6 tháng/lần (5 chủng), diệt chuột, không cho uống nước ao tù, vệ sinh chuồng, cách ly heo mới"]}},{id:"ht11",subId:"heo-thit",group:"heo",name:"Ghẻ lở Sarcoptes",sections:{gioiThieu:"Sarcoptes scabiei gây ngứa dữ dội, đóng vảy tai, da dày, chậm lớn, heo mọi lứa tuổi, lây qua tiếp xúc.",nguyenNhan:"Sarcoptes scabiei var suis, đào hang da, đẻ trứng, chu kỳ 14 ngày, tồn tại chuồng 3 tuần.",trieuChung:["Ngứa dữ, cọ tường, cọ chuồng, lắc tai","Vảy trắng xám ở tai, mũi, đuôi, sau đó lan toàn thân, da dày như da voi","Heo gầy, chậm lớn, còi"],benhTich:["Da viêm, ghẻ đào hang, có trứng, ấu trùng dưới kính hiển vi","Da dày, nứt nẻ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Ivermectin 1% 0.3ml/10kg tiêm dưới da sau tai 2 lần cách 7-10 ngày","Hoặc Doramectin 0.3ml/10kg","Bôi mỡ kẽm + Betadine, phun chuồng Hantox 1ml/lít, đốt rơm lót"],icovet:["Doramectin 1ml/33kg tiêm 1 lần","Phun sát trùng"],hanoi:["Theo Hà Nội + Thái Nguyên: Phun chuồng Hantox, đốt rơm lót, tắm heo bằng Hantox 1ml/2 lít, cách ly heo ghẻ"]}),phongNgua:["Tẩy ghẻ định kỳ nái trước đẻ 14 ngày bằng Ivermectin, heo thịt lúc 2 tháng tuổi","Vệ sinh chuồng, phun Hantox định kỳ, không nhập heo ghẻ"]}},{id:"hd1",subId:"heo-duc",group:"heo",name:"Kém tinh trùng heo đực",sections:{gioiThieu:"Tinh loãng, kỳ hình, di động kém, tỷ lệ đậu thai thấp, heo đực 1-3 tuổi.",nguyenNhan:"Nhiệt độ chuồng >28°C, thiếu Vitamin E, Selen, Kẽm, L-Carnitine, khai thác quá mức >3 lần/tuần, béo.",trieuChung:["Tỷ lệ đậu thai thấp <75%","Tinh di động <70%, kỳ hình >20%, mật độ <200 triệu/ml","Heo đực mệt, bỏ ăn sau khai thác"],benhTich:["Không rõ, tinh hoàn có thể nhỏ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: ADE + Selen 5ml + Vitamin C 2g + Kẽm 100ppm 10 ngày","L-Carnitine + Vitamin E 500mg/ngày","Giảm phối 1 lần/tuần, cho nghỉ 10 ngày"],icovet:["L-Carnitine + Kẽm + Vitamin E bổ sung hàng ngày","Làm mát chuồng"],hanoi:["Theo Hà Nội + Thái Nguyên: Làm mát chuồng đực bằng quạt, phun sương, giữ <28°C, tắm mát 2 lần/ngày"]}),phongNgua:["Chuồng mát <28°C, bổ sung Vitamin E 500mg + Selen 0.3ppm + Kẽm 100ppm thường xuyên, khai thác 2-3 lần/tuần, không béo"]}},{id:"hd2",subId:"heo-duc",group:"heo",name:"Viêm tinh hoàn Brucella, Strep",sections:{gioiThieu:"Viêm tinh hoàn do Brucella suis, Strep, Staph, chấn thương, heo đực giống.",nguyenNhan:"Brucella suis (nguy hiểm, lây người), nhiễm trùng ngược dòng từ niệu đạo, vết cắn, chấn thương.",trieuChung:["Tinh hoàn sưng to một bên, nóng, đỏ, đau, heo đi khập khiễng","Sốt 40-41°C, bỏ ăn","Tinh loãng, có mủ, máu"],benhTich:["Tinh hoàn mủ, hoại tử, teo sau 2-3 tuần","Mào tinh sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Kháng sinh Enrofloxacin 10% 1ml/20kg + Dexamethasone 0.2mg/kg 3 ngày","Chườm lạnh ngày đầu, sau chườm ấm","Nếu Brucella dương tính bắt buộc loại thải"],icovet:["Test Brucella bằng Rose Bengal, nếu dương tính loại thải ngay, không điều trị","Cách ly"],hanoi:["Theo Hà Nội + Thái Nguyên: Cách ly, test Brucella toàn đàn, sát trùng, không dùng đực nghi Brucella phối"]}),phongNgua:["Test Brucella định kỳ 6 tháng/lần, vệ sinh dụng cụ phối, găng tay vô trùng, không cho đực cắn nhau"]}},{id:"hd3",subId:"heo-duc",group:"heo",name:"Ký sinh trùng trong ngoài (giun, ghẻ, rận)",sections:{gioiThieu:"Giun đũa, giun lươn, ghẻ, rận gây ngứa, gầy, chậm lớn, thiếu máu, heo mọi lứa tuổi.",nguyenNhan:"Ascaris suum, Oesophagostomum, Sarcoptes, Haematopinus, chuồng bẩn, phân không ủ.",trieuChung:["Gầy, lông xù, bụng to, ỉa ra giun, ngứa cọ tường, vảy tai","Thiếu máu, da nhợt, ho nếu giun qua phổi","Rận hút máu, ngứa"],benhTich:["Ruột chứa giun, gan có đốm trắng sữa do giun di hành","Da ghẻ, rận"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Ivermectin 1% 0.3ml/10kg tiêm SC 2 lần cách 7 ngày diệt cả trong ngoài","Hoặc Fenbendazole 5mg/kg trộn cám 3 ngày + phun Hantox ghẻ rận","Bổ sung sắt + B12 nếu thiếu máu"],icovet:["Doramectin 0.3ml/10kg + Albendazole","Vệ sinh chuồng"],hanoi:["Theo Hà Nội + Thái Nguyên: Tẩy định kỳ 3 tháng/lần, ủ phân 60 ngày, phun chuồng, phát quang bụi rậm"]}),phongNgua:["Tẩy giun, ghẻ định kỳ 3 tháng/lần bằng Ivermectin, vệ sinh chuồng, ủ phân, phát quang bụi rậm, không để phân tồn"]}},{id:"hd4",subId:"heo-duc",group:"heo",name:"Nóng sốt không rõ nguyên nhân",sections:{gioiThieu:"Heo sốt 40-41.5°C không rõ nguyên nhân, thường do virus, vi khuẩn huyết, stress nhiệt.",nguyenNhan:"PRRS, CSF, cúm, E.coli huyết, Lepto, stress nhiệt, chuồng nóng >32°C, thiếu nước.",trieuChung:["Sốt cao 40-42°C, bỏ ăn, nằm, thở nhanh","Không có triệu chứng đặc hiệu khác, có thể tím tai nhẹ","Nếu do virus sẽ có thêm ho, tiêu chảy"],benhTich:["Không đặc hiệu, có thể hạch sưng, phổi xung huyết"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Hạ sốt Ketoprofen 3mg/kg hoặc Paracetamol 10mg/kg","• Kháng sinh phổ rộng Enro 10% + Amoxi LA để phủ Gram âm và Gram dương","• Trợ sức Gluco K-C + Vitamin C liều cao 2g/lít nước","• Làm mát chuồng, cho uống nước mát, truyền Gluco 5% nếu nặng"],icovet:["Tulathromycin 2.5mg/kg + Ketoprofen","Test nhanh PRRS, CSF nếu sốt kéo dài"],hanoi:["Theo Hà Nội + Thái Nguyên: Làm mát, tăng thoáng, giảm mật độ, phun sương, không để nóng"]}),phongNgua:["Vaccine đầy đủ PRRS, CSF, FMD, an toàn sinh học, chuồng mát <28°C, đủ nước uống, giảm stress"]}},{id:"hd5",subId:"heo-duc",group:"heo",name:"Biếng ăn heo thịt, heo nái",sections:{gioiThieu:"Heo biếng ăn, ăn ít, bỏ ăn không sốt hoặc sốt nhẹ, ảnh hưởng tăng trọng, sản xuất.",nguyenNhan:"Thức ăn kém ngon, mốc, đổi cám đột ngột, nóng, bệnh nhẹ (Myco, E.coli), loét dạ dày, stress, thiếu nước.",trieuChung:["Ăn ít, bỏ ăn, chọn cám, ăn chậm","Gầy, lông xù, phân táo hoặc bình thường","Có thể sốt nhẹ 39.5-40°C"],benhTich:["Dạ dày có thể loét, ruột bình thường"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Kiểm tra cám mốc, đổi cám ngon, bổ sung men tiêu hóa Biozyme + B.complex + Gluco K-C","Nếu loét dạ dày: Omeprazole + Amoxi","Tẩy giun nếu gầy"],icovet:["Men sống + Vitamin B12 kích thích thèm ăn","Giảm stress"],hanoi:["Theo Hà Nội + Thái Nguyên: Cho ăn đúng giờ, đủ nước, mát chuồng, không đổi cám đột ngột"]}),phongNgua:["Cám ngon, không mốc, bảo quản mát, cho ăn đúng giờ, đủ nước, mát chuồng, tẩy giun định kỳ, bổ sung men"]}},{id:"hd6",subId:"heo-duc",group:"heo",name:"Ho hen heo thịt",sections:{gioiThieu:"Heo ho khan, ho có đờm, thở bụng, nguyên nhân hô hấp phức hợp.",nguyenNhan:"Mycoplasma, Pasteurella, APP, PRRS, bụi, NH3 cao >25ppm, lạnh, ghép đàn.",trieuChung:["Ho khan sáng sớm, ho khi lùa, thở nhanh, thở bụng","Chảy nước mũi, sốt nhẹ hoặc cao nếu ghép","Chậm lớn"],benhTich:["Phổi gan hóa, dính sườn, có mủ, màng phổi fibrin"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tilmicosin 300ppm + Doxy 200ppm trộn 10 ngày + Bromhexin long đờm","Hoặc Tulathromycin 2.5mg/kg 1 liều + Ketoprofen","Phun sát trùng nhẹ, tăng thoáng"],icovet:["Tulathromycin + Bromhexin","Vaccine Myco, APP"],hanoi:["Theo Hà Nội + Thái Nguyên: Giảm bụi, giảm NH3, thông thoáng, giảm mật độ, ấm chuồng"]}),phongNgua:["Vaccine Myco, APP, PRRS, thông thoáng, giảm bụi, NH3 <20ppm, không lạnh, không ghép đàn, all in-all out"]}},{id:"hd7",subId:"heo-duc",group:"heo",name:"Tiêu chảy chung heo thịt",sections:{gioiThieu:"Heo thịt tiêu chảy phân lỏng, vàng, xám, không máu, nhiều nguyên nhân.",nguyenNhan:"E.coli, Salmonella, Brachyspira, Lawsonia, cám mốc, đổi cám, lạnh, giun.",trieuChung:["Phân lỏng vàng, xám, có bọt, mùi thối, bết đít","Heo gầy, lông xù, ăn kém","Có thể sốt nhẹ"],benhTich:["Ruột non, già viêm, chứa dịch vàng, hạch màng treo sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Colistin 10mg/kg + Enro 10% 1ml/20kg 3-5 ngày + men tiêu hóa + Gluco K-C","Nếu do Brachyspira: Tiamulin 10mg/kg","Nếu do Lawsonia: Tylosin 10mg/kg","Bù điện giải"],icovet:["Trộn cám Apramycin + Neomycin 5 ngày","Tẩy giun"],hanoi:["Theo Hà Nội + Thái Nguyên: Kiểm tra cám, không mốc, đủ ấm, vệ sinh nước uống"]}),phongNgua:["Cám tốt, không mốc, không đổi cám đột ngột, đủ ấm, vệ sinh nước uống, tẩy giun định kỳ, vaccine Salmonella, Lawsonia"]}},{id:"hd8",subId:"heo-duc",group:"heo",name:"Viêm da heo (tiết dịch, nấm, ghẻ)",sections:{gioiThieu:"Heo viêm da đỏ, mụn mủ, bong vảy, ngứa, nhiều nguyên nhân vi khuẩn, nấm, ghẻ.",nguyenNhan:"Staphylococcus hyicus (viêm da tiết dịch), nấm Microsporum, ghẻ Sarcoptes, vết cắn nhau.",trieuChung:["Da đỏ, mụn mủ, bong vảy như mỡ, nhờn nâu, ngứa","Heo con: da bong tróc như bôi dầu, chết do mất nước","Heo lớn: vảy, ngứa, cọ tường"],benhTich:["Da viêm, bong thượng bì, có mủ, nấm, ghẻ dưới kính"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Nếu do Staph: Cefalexin 10mg/kg + Betadine tắm 0.5% + bù điện giải","Nếu ghẻ: Ivermectin 0.3ml/10kg","Nếu nấm: Griseofulvin + bôi Ketoconazole","Mài nanh, cắt đuôi sát trùng"],icovet:["Amoxi + Clavulanic 15mg/kg + kẽm oxit bôi","Phun Hantox chuồng"],hanoi:["Theo Hà Nội + Thái Nguyên: Vệ sinh, sát trùng rốn, mài nanh đúng, không để cắn nhau, giảm mật độ"]}),phongNgua:["Sát trùng rốn, mài nanh, cắt đuôi đúng, vệ sinh chuồng khô, giảm mật độ, không để cắn nhau, tắm heo nái trước đẻ"]}},{id:"hd9",subId:"heo-duc",group:"heo",name:"Stress heo (vận chuyển, nhiệt, ghép đàn)",sections:{gioiThieu:"Heo stress do vận chuyển, nhiệt độ cao, ghép đàn, tiếng ồn, đánh nhau, ảnh hưởng miễn dịch.",nguyenNhan:"Nhiệt độ >32°C, ẩm >80%, vận chuyển xa, ghép đàn lạ, mật độ dày, tiếng ồn, thiếu nước.",trieuChung:["Thở nhanh, há mồm, nằm, bỏ ăn, run, có thể chết đột ngột nếu stress nặng (PSS)","Cắn nhau, què, trầy da","Giảm đề kháng, dễ nhiễm PRRS, Myco"],benhTich:["Không đặc hiệu, thịt PSE nếu stress trước giết mổ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Vitamin C 2g/lít nước + Gluco K-C + điện giải Oresol cho uống tự do","ADE + Selen 3 ngày","Làm mát chuồng, phun sương, giảm mật độ, không ghép đàn lạ","Nếu vận chuyển: cho nghỉ 12h, uống Gluco K-C trước và sau"],icovet:["Vitamin C + điện giải + men","An thần Azaperone nếu cần vận chuyển xa"],hanoi:["Theo Hà Nội + Thái Nguyên: Chuồng mát <28°C, đủ nước, không ồn, không ghép đàn, vận chuyển sáng sớm hoặc chiều mát"]}),phongNgua:["Chuồng mát, đủ nước, giảm mật độ, không ghép đàn lạ, vận chuyển sáng sớm, cho uống Vitamin C + Gluco K-C trước sau vận chuyển, chọn giống kháng stress (loại gen PSS)"]}},{id:"kt1",subId:"ky-thuat",group:"heo",name:"Kỹ thuật phối giống nhân tạo",sections:{gioiThieu:"Kỹ thuật bơm tinh nhân tạo tăng tỷ lệ đậu thai 85-90%, kiểm soát dịch bệnh, tiết kiệm đực giống.",nguyenNhan:"Phối tự nhiên tỷ lệ đậu thấp, lây bệnh, tốn đực. Phối nhân tạo cần phát hiện mê ì chính xác và kỹ thuật bơm đúng.",trieuChung:["Phát hiện mê ì: đứng yên khi đè lưng, âm hộ đỏ, sưng, dịch nhầy trong, kêu la, bỏ ăn, tai dựng","Thời điểm phối: 12-24h sau bắt đầu mê ì, phối 2 lần cách 12h","Nái tơ phối muộn hơn nái dạ 12h"],benhTich:["-"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Phát hiện mê ì ngày 2 lần sáng chiều, có đực thử","• Bơm tinh: ống phối sâu 25cm, bơm chậm 3-5 phút, liều 80-100ml, 2-3 tỷ tinh trùng, tinh bảo quản 17°C dùng trong 3 ngày","• Sau bơm giữ nái yên 30 phút, không cho nằm ngay","• Bổ sung ADE + Selen trước phối 5 ngày"],icovet:["Tinh bảo quản 17°C, lắc nhẹ ngày 2 lần, dùng trong 72h","Ống phối vô trùng"],hanoi:["Theo Hà Nội + Thái Nguyên: Phối 2 lần cách 12h khi nái mê ì đứng, ghi chép phối giống, theo dõi đậu thai bằng siêu âm 28 ngày"]}),phongNgua:["Vệ sinh ống phối, găng tay vô trùng, bảo quản tinh đúng 17°C, không để tinh lạnh <15°C hoặc nóng >20°C, chọn tinh chất lượng cao"]}},{id:"kt2",subId:"ky-thuat",group:"heo",name:"Chăm sóc heo con theo mẹ",sections:{gioiThieu:"Chăm sóc heo con từ sơ sinh đến cai sữa 21-28 ngày, giảm chết, tăng đồng đều, cai sữa đạt 6-7kg.",nguyenNhan:"Heo con chết do lạnh, đói, đè, tiêu chảy, thiếu sắt, cắn nhau. Cần quy trình chăm sóc chuẩn 7 ngày đầu.",trieuChung:["Ngày 1: lau khô, cắt rốn 3cm sát trùng iod 10%, cho bú sữa đầu trong 1h, giữ ấm 32-34°C","Ngày 3: tiêm sắt 200mg Fe-Dextran + cắt đuôi, mài nanh","Ngày 7: tập ăn sớm bằng cám tập ăn, men","Ngày 14: tiêm sắt lần 2 + thiến nếu cần"],benhTich:["Heo con ngạt tím nếu đẻ khó","Thiếu sắt da nhợt, lông xù"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Đỡ đẻ: Oxytocin 10-20UI khi cổ tử cung mở, can thiệp tay găng + gel","• Lau khô, cắt rốn 3cm + sát trùng iod, cho bú sữa đầu trong 1h đầu quan trọng nhất","• Giữ ấm 32-34°C tuần 1, giảm 2°C mỗi tuần, đèn hồng ngoại 24/24","• Tiêm sắt 200mg ngày 3 và 14, Amoxi 1ml/10kg phòng tiêu chảy"],icovet:["Giữ ấm heo con 34°C, cho bú sữa đầu trong 1h, không để đói","Men tiêu hóa + Gluco K-C"],hanoi:["Theo Hà Nội + Thái Nguyên: Tiêm kháng sinh + kháng viêm cho nái sau đẻ, chuồng đẻ sạch, yên tĩnh, giảm ăn nái trước đẻ 20%"]}),phongNgua:["Chuồng đẻ sạch, yên tĩnh, ấm, khô, sát trùng trước đẻ 3 ngày","Nái ăn đủ, không béo, cho heo con bú đều, phân cỡ, không để đè"]}},{id:"kt3",subId:"ky-thuat",group:"heo",name:"Vệ sinh sát trùng chuồng trại",sections:{gioiThieu:"Quy trình vệ sinh sát trùng all in-all out, giảm mầm bệnh, an toàn sinh học 5 lớp, phòng ASF, PRRS.",nguyenNhan:"Chuồng bẩn, phân tồn, không sát trùng, người, xe, chuột, chim mang mầm bệnh vào.",trieuChung:["Quy trình 5 bước: dọn phân, rửa bằng nước áp lực, ngâm xà phòng 30 phút, rửa lại, phun sát trùng, để khô 3-7 ngày","Sát trùng: Virkon 1/100, NaOH 2%, Formalin 2%, vôi bột 1kg/m2","Ủ phân 60-90 ngày, diệt chuột, chim, côn trùng"],benhTich:["-"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Hàng ngày: quét phân, rửa sàn, phun sát trùng nhẹ Virkon 1/200","• Cuối lứa: dọn sạch, rửa áp lực, ngâm xà phòng, phun NaOH 2% hoặc Virkon 1/100, rắc vôi bột, để trống 7 ngày","• Ủ phân 60 ngày, đốt rơm lót, khò gas 80°C diệt oocyst cầu trùng","• Người ra vào tắm, thay ủng, quần áo riêng"],icovet:["An toàn sinh học 5 lớp: cổng, người, xe, chuột, chim","Sát trùng xe bằng NaOH, vôi"],hanoi:["Theo Hà Nội + Thái Nguyên: Phác đồ tương tự, tăng cường diệt chuột, chim, côn trùng, không cho người lạ vào trại"]}),phongNgua:["All in-all out, không trộn đàn, cách ly heo mới 30 ngày, sát trùng định kỳ, ủ phân, diệt chuột, chim, an toàn sinh học, không cho ăn thức ăn thừa"]}},{id:"gc1",subId:"ga-con",group:"giacam",name:"Bạch lỵ gà con Pullorum",sections:{gioiThieu:"Salmonella pullorum gà 1-10 ngày tuổi, truyền qua trứng, chết 20-80%, phân trắng bết hậu môn.",nguyenNhan:"S. pullorum, truyền dọc qua trứng từ gà mẹ nhiễm, tồn tại máy ấp, chuồng bẩn.",trieuChung:["Gà con ủ rũ, chụm lại, phân trắng bết hậu môn, khó thở, kêu chíp","Chết nhiều 3-7 ngày tuổi, tỷ lệ chết 20-80%","Gà lớn mang trùng không triệu chứng"],benhTich:["Gan, tim, phổi có nốt hoại tử trắng như hạt kê","Ruột viêm, manh tràng chứa phân trắng","Túi lòng đỏ không tiêu"],dieuTri:h({bacLieu:["Theo Bạc Liêu:","• Enrofloxacin 10% 1ml/2 lít nước + Colistin 1g/10 lít 3-5 ngày","• Bổ sung Vitamin ADE + Gluco K-C + men","• Tăng nhiệt độ chuồng 2°C, giảm mật độ"],icovet:["Test nhanh pullorum đàn bố mẹ bằng kháng nguyên Pullorum, loại bỏ dương tính","Sát trùng trứng bằng Formalin"],hanoi:["Theo Hà Nội + Thái Nguyên: Loại bỏ đàn nhiễm, chọn giống sạch Pullorum, sát trùng máy ấp"]}),phongNgua:["Chọn giống sạch Pullorum, test pullorum đàn bố mẹ, sát trùng trứng, máy ấp, chuồng trại, không ấp trứng bẩn"]}},{id:"gc2",subId:"ga-con",group:"giacam",name:"Thương hàn gà con",sections:{gioiThieu:"Salmonella gallinarum gà con 1-3 tuần, sốt, ủ rũ, phân trắng vàng, chết cấp.",nguyenNhan:"Salmonella gallinarum, lây qua phân, trứng, máy ấp, chuột.",trieuChung:["Sốt 43-44°C, ủ rũ, xù lông, phân trắng vàng, bỏ ăn","Chết cấp 10-30%, gà lớn gầy, giảm đẻ"],benhTich:["Gan sưng to, màu đồng, có nốt hoại tử, lách to","Ruột viêm, xuất huyết","Buồng trứng viêm"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Florfenicol 20mg/kg + Doxycyclin 10mg/kg 5 ngày trộn cám","Men tiêu hóa + Gluco K-C","Sát trùng chuồng"],icovet:["Enrofloxac
