",category:"Heo",tab:"kinhnghiem",tags:["Heo","Nái","Giống"],short:"Chọn nái hậu bị 6 tháng, 100kg, vú đều 12-14 vú.",trieuChung:"Trại cần thay đàn nái, nái cũ đẻ ít 7-8 con, tỷ lệ loại cao.",chanDoan:"Chọn nái không đúng tiêu chuẩn: chân yếu, vú lệch, ngoại hình không đạt.",dieuTri:"Cách làm: Chọn heo 6 tháng 90-100kg, lưng thẳng, chân to khỏe, vú đều 12-14 vú, khoảng cách vú đều, âm hộ không dị tật. Phối lần 2 khi lên giống lần 2 (8 tháng, 120kg).",cheDoAn:"Đàn nái mới đẻ trung bình 11-12 con/lứa, đều con, nuôi con khéo, tỷ lệ cai sữa 10.5 con.",thongTinChu:"Ghi chép nguồn gốc, tiêm phòng đầy đủ Parvo, PRRS trước phối 1 tháng.",canhBao:"Không chọn nái quá béo (>130kg) dễ khó đẻ, không chọn nái có tiền sử bệnh.",images:[],date:"18/03/2024",author:"ThS. Hùng - Bình Dương"},{id:"kn-4",name:"Xử lý gà bị hen CRD không dùng kháng sinh",category:"Gà/Vịt",tab:"kinhnghiem",tags:["Gà/Vịt","CRD","Hô hấp"],short:"Gà thịt 30 ngày ho, khò khè, chảy mũi - dùng thảo dược.",trieuChung:"Gà 30 ngày tuổi ho khan, khò khè về đêm, chảy mũi, sưng mặt nhẹ, ăn giảm 20%, 500 con.",chanDoan:"CRD do Mycoplasma + bụi + amoniac cao. Độn chuồng ẩm, thông gió kém.",dieuTri:"Thuốc: Tỏi 20g/kg thức ăn + Bromhexin long đờm 1g/2L nước + Vitamin C. Liều: Tỏi giã trộn 3 ngày, phun sát trùng chuồng bằng Iodine, tăng thông gió, thay độn chuồng khô.",cheDoAn:"Sau 5 ngày gà hết khò khè, ăn lại bình thường, không chết thêm. Giảm chi phí kháng sinh 70%.",thongTinChu:"Giữ chuồng khô, thoáng, phun sát trùng định kỳ 3 ngày/lần.",canhBao:"Nếu nặng ghép E.coli phải dùng Doxycycline 5 ngày, không chủ quan.",images:[],date:"22/02/2024",author:"Anh Nam - Trại gà Bến Tre"},{id:"kn-5",name:"Bí kíp vỗ béo bò 6 tháng đạt 500kg",category:"Bò/Dê",tab:"kinhnghiem",tags:["Bò/Dê","Vỗ béo","Dinh dưỡng"],short:"Bò vàng 200kg vỗ 6 tháng lên 480-500kg.",trieuChung:"Bò gầy 180-200kg, cần vỗ béo nhanh bán Tết, thời gian 6 tháng.",chanDoan:"Thiếu đạm, thiếu tinh bột, bò chưa tẩy giun sán, chuồng ẩm.",dieuTri:"Cách làm: Tẩy giun Albendazole 1 liều, sau 7 ngày bắt đầu vỗ: Cỏ voi 30kg + rơm ủ ure 5kg + cám hỗn hợp 3kg (đạm 16%) + bã bia 5kg/ngày. Uống nước tự do + muối khoáng.",cheDoAn:"Tăng trọng 0.9-1.1kg/ngày, 6 tháng đạt 480-500kg, lãi 8-10 triệu/con.",thongTinChu:"Chia 2 bữa chính sáng chiều, tắm chải bò hàng ngày, chuồng khô.",canhBao:"Không tăng cám đột ngột gây chướng hơi, tăng dần 0.5kg mỗi 3 ngày.",images:[],date:"10/01/2024",author:"Chú Sáu - Củ Chi"},{id:"kn-6",name:"Nuôi vịt siêu trứng 300 quả/năm - ít bệnh",category:"Gà/Vịt",tab:"kinhnghiem",tags:["Gà/Vịt","Vịt","Trứng"],short:"Vịt đẻ 280-300 quả/năm, vỏ đẹp, ít bệnh.",trieuChung:"Vịt đẻ 200 quả/năm, vỏ mỏng, hay bệnh tụ huyết trùng, hao hụt cao.",chanDoan:"Thiếu ánh sáng, thiếu Ca, chuồng ướt, không tiêm phòng.",dieuTri:"Cách làm: Ánh sáng 16h/ngày, thức ăn 18% đạm + vỏ sò 8%, tiêm vaccine tụ huyết trùng 6 tháng/lần + dịch tả vịt, chuồng khô, bể bơi sạch thay hàng ngày.",cheDoAn:"Vịt đẻ đều 280-300 quả/năm, tỷ lệ ấp nở 85%, hao hụt <5%.",thongTinChu:"Cho ăn đúng giờ, bổ sung Vitamin ADE 2 lần/tháng.",canhBao:"Không cho vịt ăn thức ăn mốc, dễ nấm phổi.",images:[],date:"03/03/2024",author:"Cô Lan - Tiền Giang"},{id:"kn-7",name:"Xử lý nước ao tôm sú - hết phân trắng",category:"Thủy sản",tab:"kinhnghiem",tags:["Thủy sản","Tôm","Nước"],short:"Tôm sú 45 ngày phân trắng, gan nhạt - xử lý nước khỏi.",trieuChung:"Tôm sú 45 ngày phân trắng nổi, gan nhạt, ruột rỗng, bỏ ăn, 2000m2 ao đất.",chanDoan:"Nước ao NH3 cao, đáy đen, vi khuẩn Vibrio cao, tảo tàn.",dieuTri:"Cách làm: Giảm ăn 50% 3 ngày, thay 30% nước, đánh vôi CaCO3 10kg/1000m3 buổi tối, cấy men vi sinh Bacillus 2kg/1000m3, trộn thảo dược gan + men tiêu hóa 5g/kg thức ăn.",cheDoAn:"Sau 7 ngày tôm ăn lại, phân đen, gan vàng đẹp, tỷ lệ sống 80%, về đích 30 con/kg.",thongTinChu:"Quạt nước 24/24, kiểm tra pH, kiềm hàng ngày.",canhBao:"Không dùng kháng sinh bừa bãi gây kháng thuốc, tập trung xử lý nước.",images:[],date:"15/04/2024",author:"Anh Kiên - Sóc Trăng"},{id:"kn-8",name:"Trị ghẻ chó mèo bằng lá trà xanh + Ivermectin",category:"Chó Mèo",tab:"kinhnghiem",tags:["Chó Mèo","Ghẻ","Da"],short:"Chó ta ghẻ nặng rụng lông 70%, ngứa dữ.",trieuChung:"Chó 1 năm tuổi ghẻ Demodex nặng, rụng lông vùng mặt lưng, da dày, ngứa gãi liên tục, 2 tháng.",chanDoan:"Ghẻ Demodex + nấm da, sức đề kháng kém, chuồng ẩm.",dieuTri:"Thuốc: Ivermectin 1% 0.5ml/10kg tiêm dưới da 2 lần cách 7 ngày + tắm lá trà xanh + nước muối ấm 3 ngày/lần, bổ sung Vitamin ADE + kẽm.",cheDoAn:"Sau 3 tuần lông mọc lại 60%, hết ngứa, sau 6 tuần lông mượt 90%.",thongTinChu:"Tắm nắng buổi sáng, chuồng khô, giặt ổ nằm.",canhBao:"Chó Collie không dùng Ivermectin, dùng NexGard thay thế. Không tắm xà phòng mạnh.",images:[],date:"28/01/2024",author:"BS Thú Y Minh - HCM"},{id:"kn-9",name:"Ủ chua cỏ voi cho bò sữa - sữa tăng 3 lít",category:"Thức Ăn",tab:"kinhnghiem",tags:["Thức Ăn","Bò/Dê","Ủ chua"],short:"Ủ chua cỏ voi + rỉ mật, bò sữa ăn tốt, sữa tăng.",trieuChung:"Mùa khô thiếu cỏ xanh, bò sữa giảm sữa 2-3 lít/ngày, chi phí thức ăn cao.",chanDoan:"Thiếu cỏ tươi, rơm khô đạm thấp, không dự trữ.",dieuTri:"Cách làm: Cỏ voi 60 ngày băm 3cm, trộn rỉ mật 3% + muối 0.5% + men ủ chua, nén chặt vào bao nilon, ủ 21 ngày. Cho ăn 20kg/con/ngày + cám.",cheDoAn:"Bò ăn ngon, sữa tăng 2-3 lít/ngày, phân đẹp, tiết kiệm 30% chi phí cỏ mùa khô.",thongTinChu:"Ủ nơi râm mát, không thủng bao, dùng trong 3 tháng.",canhBao:"Cỏ ủ có mùi chua thơm là đạt, mùi thối là hỏng bỏ.",images:[],date:"05/01/2024",author:"HTX Bò sữa - Đà Lạt"},{id:"kn-10",name:"Phòng tiêu chảy gà con bằng men tỏi",category:"Gà/Vịt",tab:"kinhnghiem",tags:["Gà/Vịt","Men","Tiêu chảy"],short:"Gà con 1-21 ngày không tiêu chảy, đều con.",trieuChung:"Gà con úm hay tiêu chảy phân trắng, chết 5-10% tuần đầu.",chanDoan:"Úm lạnh, E.coli, Salmonella từ trứng ấp.",dieuTri:"Cách làm: Nước đường + Vitamin C ngày 1, men vi sinh + tỏi 5g/kg thức ăn từ ngày 2-21, giữ nhiệt 33-35°C tuần 1, độn chuồng khô, sát trùng trứng ấp.",cheDoAn:"Tỷ lệ chết <2%, gà đều, không tiêu
