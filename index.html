 vịt bố mẹ 2 lần trước đẻ, kháng thể phòng cho vịt con 1 ngày tuổi 0.5ml/con nếu vùng dịch, sát trùng chuồng, cách ly"]}},{id:"th1a",subId:"tetra",group:"thuoc",name:"Oxytetracyclin LA 20% - Tetracyclin phổ rộng kéo dài",sections:{gioiThieu:"Kháng sinh phổ rộng nhóm Tetracyclin, tác dụng kéo dài 48-72h, kìm khuẩn, giá rẻ, dùng nhiều heo, gà.",nguyenNhan:"Cơ chế: ức chế tổng hợp protein 30S ribosome, gắn Canxi, phổ rộng Gram âm, Gram dương, Mycoplasma, Rickettsia, Chlamydia.",trieuChung:["Chỉ định: Tụ huyết trùng, phó thương hàn, viêm phổi, Lepto, đóng dấu, viêm tử cung MMA, CRD, thương hàn gà","Liều: heo 20mg/kg, gà 50mg/kg, tiêm bắp sâu, 3 ngày/lần LA","Tồn dư: thịt 28 ngày, sữa 7 ngày"],benhTich:["Chống chỉ định: Heo con thiếu sắt nặng, phối hợp Canxi, sữa, Fe giảm hấp thu","Độc gan thận nếu quá liều kéo dài"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Heo: 1ml/10kg bắp cổ sâu, 3 ngày/lần, 3 mũi","Gia cầm: 50mg/kg thể trọng hoặc 1g/10 lít nước 3-5 ngày","Kết hợp Bromhexin nếu ho"],icovet:["Không trộn chung Beta-lactam (đối kháng)","Không dùng chung với Canxi, Fe"],hanoi:["Theo Hà Nội + Thái Nguyên: Thời gian ngừng thuốc thịt 28 ngày, bảo quản mát, tránh ánh sáng, lắc đều trước dùng"]}),phongNgua:["Bảo quản mát <30°C, tránh ánh sáng, không dùng quá 5 ngày liên tục, đủ nước uống"]}},{id:"th1b",subId:"tetra",group:"thuoc",name:"Doxycyclin 10% - Tetracyclin thế hệ 2 hấp thu tốt",sections:{gioiThieu:"Tetracyclin thế hệ 2, hấp thu tốt hơn Oxy, ít gắn Canxi, ít độc gan thận, hiệu quả hô hấp cao.",nguyenNhan:"Cơ chế: như Oxy nhưng hấp thu 90%, thải trừ chậm, tập trung phổi cao, phổ Mycoplasma, Rickettsia, Chlamydia, E.coli.",trieuChung:["Chỉ định: CRD gà, suyễn heo Myco, E.coli, tụ huyết trùng, Ornithobacterium","Liều: 10-20mg/kg thể trọng, uống 5-7 ngày","An toàn hơn Oxy cho gà đẻ, heo con"],benhTich:["Ít độc gan thận, ít gắn Canxi, dùng được gà đẻ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Trộn thức ăn 300ppm 5-7 ngày hoặc pha nước 1g/5 lít nước 5 ngày","Kết hợp Tylosin 100ppm tăng hiệu quả hô hấp","Cho uống đủ nước"],icovet:["Kết hợp Tylosin hoặc Tilmicosin trong CRD phức hợp","Không pha chung Beta-lactam"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 7 ngày, trứng 3 ngày, bảo quản mát"]}),phongNgua:["Uống đủ nước, không dùng quá 7 ngày, bảo quản mát"]}},{id:"th2a",subId:"beta",group:"thuoc",name:"Amoxicillin LA 15% - Beta-lactam phổ rộng",sections:{gioiThieu:"Beta-lactam phổ rộng, diệt khuẩn, ức chế tổng hợp vách tế bào, an toàn cho nái chửa, heo con.",nguyenNhan:"Cơ chế: gắn PBP, ức chế tổng hợp peptidoglycan vách tế bào, diệt khuẩn, phổ Gram dương, Gram âm, nhạy cảm.",trieuChung:["Chỉ định: Strep suis viêm màng não, tụ huyết trùng, viêm tử cung MMA, viêm vú, đóng dấu, E.coli, CRD","Liều: 15mg/kg bắp, 48h/lần LA, 2-3 mũi","An toàn cho nái chửa, heo con"],benhTich:["An toàn cao, ít độc, dị ứng nếu quá mẫn Penicillin"],dieuTri:h({bacLieu:["Theo Bạc Liêu: 1ml/10kg bắp cổ sâu, 48h/lần, 2-3 lần","Kết hợp Gentamycin 4mg/kg trong MMA tăng hiệu quả Gram âm","Gia cầm: 20mg/kg nước 3-5 ngày"],icovet:["Không pha chung Tetracyclin, Sulfonamid (đối kháng)","Tiêm bắp cổ, không tiêm mông"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 14 ngày, sữa 3 ngày, bảo quản mát, lắc đều"]}),phongNgua:["Tiêm bắp cổ sâu, không tiêm quá 10ml/chỗ, bảo quản mát, test dị ứng nếu cần"]}},{id:"th2b",subId:"beta",group:"thuoc",name:"Ceftiofur 5% - Cephalosporin thế hệ 3 đặc hiệu hô hấp",sections:{gioiThieu:"Cephalosporin thế hệ 3, đặc hiệu hô hấp, diệt khuẩn mạnh APP, Pasteurella, Salmonella, E.coli, ít tồn dư.",nguyenNhan:"Cơ chế: như Beta-lactam nhưng kháng beta-lactamase, phổ rộng, tập trung phổi, diệt khuẩn nhanh.",trieuChung:["Chỉ định: APP viêm phổi dính sườn, Glasser, tụ huyết trùng, Salmonella, viêm tử cung, MMA","Liều: 3-5mg/kg bắp 1 lần/ngày 3-5 ngày","Tồn dư thấp: thịt 4 ngày"],benhTich:["Ít tồn dư, an toàn cho nái chửa, heo con, ít dị ứng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: 1ml/20kg bắp, 3-5 ngày liên tục, kết hợp Ketoprofen 3mg/kg nếu sốt cao","Hoặc Ceftiofur crystalline 5mg/kg 1 liều duy nhất tác dụng 7 ngày"],icovet:["Dùng 1 lần/ngày, tiêm bắp cổ","Kết hợp Ketoprofen tăng hiệu quả"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 4 ngày, bảo quản 2-8°C sau mở nắp dùng trong 28 ngày"]}),phongNgua:["Bảo quản 2-8°C sau mở nắp, tiêm bắp cổ, không trộn chung thuốc khác, dùng hết trong 28 ngày"]}},{id:"th3a",subId:"amino",group:"thuoc",name:"Gentamycin 10% - Aminoglycosid diệt Gram âm mạnh",sections:{gioiThieu:"Aminoglycosid diệt Gram âm mạnh, kìm khuẩn, diệt khuẩn nồng độ cao, dùng MMA, E.coli, viêm tử cung.",nguyenNhan:"Cơ chế: gắn 30S ribosome, ức chế tổng hợp protein, diệt khuẩn, phổ E.coli, Klebsiella, Pseudomonas, Staph.",trieuChung:["Chỉ định: E.coli phù đầu, viêm tử cung, MMA, viêm vú, nhiễm trùng huyết Gram âm","Liều: 4-6mg/kg bắp, 1 lần/ngày 3-5 ngày","Độc thận, thính giác nếu quá liều, kéo dài"],benhTich:["Độc thận nếu quá liều, mất nước, dùng kéo dài >5 ngày","Không dùng gà đẻ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: 1ml/20kg bắp + Amoxi 15mg/kg trong MMA 3 ngày hiệu quả cao","Gia cầm: 5mg/kg bắp hoặc 5mg/kg nước 3 ngày","Bù điện giải, giải độc gan thận khi dùng"],icovet:["Không dùng kéo dài >5 ngày, theo dõi thận, cho uống nhiều nước","Không trộn chung Beta-lactam cùng lọ"],hanoi:["Theo Hà Nội + Thái Nguyên: Bù điện giải, giải độc gan thận, ngừng thuốc thịt 14 ngày"]}),phongNgua:["Theo dõi thận, cho uống nhiều nước, không dùng kéo dài, không dùng nái chửa 3 tháng cuối nếu không cần"]}},{id:"th3b",subId:"amino",group:"thuoc",name:"Neomycin 20% - Aminoglycosid chỉ dùng đường uống",sections:{gioiThieu:"Chỉ dùng đường uống, không hấp thu máu, diệt E.coli đường ruột, an toàn, giá rẻ, dùng tiêu chảy.",nguyenNhan:"Cơ chế: như Gentamycin nhưng không hấp thu qua ruột, chỉ tác dụng tại ruột, diệt E.coli, Salmonella đường ruột.",trieuChung:["Chỉ định: Tiêu chảy E.coli heo con, gà con, heo thịt","Liều uống: 10-15mg/kg thể trọng hoặc 1g/10 lít nước","An toàn, ít tồn dư"],benhTich:["An toàn, không hấp thu, không độc thận nếu uống, nhưng nếu tiêm rất độc"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Pha nước 1g/10 lít 3-5 ngày hoặc trộn cám 150ppm 5 ngày","Kết hợp Colistin 10mg/kg tăng hiệu quả E.coli","Bổ sung men tiêu hóa + điện giải"],icovet:["Kết hợp Colistin, Enro trong tiêu chảy nặng","Không tiêm"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 7 ngày, vệ sinh nước uống, không để nước bẩn"]}),phongNgua:["Chỉ dùng uống, không tiêm, vệ sinh nước uống, bảo quản mát, không dùng quá 7 ngày"]}},{id:"th4a",subId:"macro",group:"thuoc",name:"Tilmicosin 20% - Macrolide đặc hiệu Mycoplasma hô hấp",sections:{gioiThieu:"Macrolide đặc hiệu Mycoplasma, hô hấp, kìm khuẩn, tập trung phổi, dùng suyễn heo, CRD gà.",nguyenNhan:"Cơ chế: ức chế 50S ribosome, kìm khuẩn, phổ Mycoplasma, Pasteurella, Staph, Gram dương, tập trung phổi cao gấp 10 lần máu.",trieuChung:["Chỉ định: Suyễn heo Mycoplasma, CRD gà, APP, viêm phổi","Liều: 10-20mg/kg, trộn 200-400ppm 15 ngày phòng suyễn, hoặc tiêm SC 10mg/kg 1 lần","Độc tim nếu tiêm IV dê, ngựa, bò, không tiêm IV"],benhTich:["Độc tim nếu tiêm tĩnh mạch, chỉ tiêm SC heo, không tiêm dê, ngựa","Đau chỗ tiêm"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Trộn 200-400ppm 15 ngày phòng suyễn heo con, hoặc 100ppm 21 ngày","Tiêm SC 10mg/kg sau tai, 1 lần, không tiêm bắp sâu","Kết hợp Doxy 100ppm tăng hiệu quả"],icovet:["Không tiêm IV, chỉ tiêm SC heo, không dùng cho dê, ngựa","Đeo găng tay khi tiêm"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 21 ngày, chỉ tiêm dưới da, không tiêm bắp, bảo quản mát"]}),phongNgua:["Chỉ tiêm dưới da sau tai, không tiêm tĩnh mạch, không dùng cho dê, ngựa, bò, đeo găng, bảo quản mát"]}},{id:"th4b",subId:"macro",group:"thuoc",name:"Tylosin 20% - Macrolide cổ điển rẻ hiệu quả hô hấp",sections:{gioiThieu:"Macrolide cổ điển, rẻ, hiệu quả hô hấp, kìm khuẩn, dùng suyễn, CRD, viêm khớp Myco, kiết lỵ Brachyspira.",nguyenNhan:"Cơ chế: ức chế 50S ribosome, phổ Mycoplasma, Gram dương, Brachyspira, Lawsonia, tập trung phổi, ruột.",trieuChung:["Chỉ định: Suyễn heo, CRD gà, viêm khớp Myco, kiết lỵ, viêm hồi tràng","Liều: 10mg/kg bắp 3-5 ngày hoặc trộn 100ppm 7-21 ngày","Đau chỗ tiêm"],benhTich:["Đau chỗ tiêm, sưng nhẹ, tự hết sau 2-3 ngày"],dieuTri:h({bacLieu:["Theo Bạc Liêu: 1ml/10kg bắp 3-5 ngày hoặc trộn cám 100ppm 7-21 ngày phòng suyễn, kiết lỵ","Kết hợp Doxy 100ppm trong CRD phức hợp","Bromhexin long đờm nếu ho nhiều"],icovet:["Kết hợp Doxy, Amoxi trong hô hấp phức hợp","Tiêm sâu bắp cổ"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 7 ngày, tiêm sâu bắp, không tiêm quá 10ml/chỗ"]}),phongNgua:["Tiêm sâu bắp cổ, không tiêm quá 10ml/chỗ, bảo quản mát, không dùng quá 7 ngày"]}},{id:"th5a",subId:"sulfa",group:"thuoc",name:"Sulfadimidine + Trimethoprim - Sulfonamid kết hợp phổ rộng cầu trùng",sections:{gioiThieu:"Sulfonamid kết hợp Trimethoprim tỉ lệ 5:1, phổ rộng, diệt cầu trùng, E.coli, tụ huyết trùng, kìm khuẩn.",nguyenNhan:"Cơ chế: ức chế tổng hợp folate 2 giai đoạn (Sulfa ức chế PABA, Trimethoprim ức chế DHFR), hiệp đồng diệt khuẩn, phổ Gram âm, Gram dương, cầu trùng, Toxoplasma.",trieuChung:["Chỉ định: Cầu trùng heo, gà ỉa máu, E.coli, tụ huyết trùng, phó thương hàn","Liều: 30mg/kg (25mg Sulfa + 5mg Trim) uống 3-5 ngày","Cần uống nhiều nước tránh sỏi thận"],benhTich:["Sỏi thận nếu thiếu nước, dùng kéo dài, quá liều","Ức chế tạo máu nếu quá liều"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Pha nước 1g/5 lít nước 3-5 ngày hoặc trộn cám 500ppm 5-7 ngày","Kết hợp Vitamin K 2mg/kg khi cầu trùng ỉa máu","Cho uống tự do nước, không để khát"],icovet:["Kết hợp Vitamin K + C khi cầu trùng máu, điện giải Gluco K-C","Không pha chung với Canxi, Fe"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 14 ngày, trứng 7 ngày, cho uống nhiều nước, không dùng quá 7 ngày"]}),phongNgua:["Cho uống tự do nước, không để khát, không dùng quá 7 ngày, không dùng gà đẻ quá liều, bảo quản mát"]}},{id:"th6a",subId:"quino",group:"thuoc",name:"Enrofloxacin 10% - Quinolone thế hệ 2 diệt khuẩn mạnh",sections:{gioiThieu:"Quinolone thế hệ 2, diệt khuẩn mạnh, phổ rộng, hấp thu tốt, tập trung phổi, niệu, dùng hô hấp, tiêu hóa.",nguyenNhan:"Cơ chế: ức chế DNA gyrase, topoisomerase IV, diệt khuẩn nhanh, phổ Gram âm (E.coli, Salmonella, Pasteurella), Mycoplasma, Gram dương.",trieuChung:["Chỉ định: E.coli phù đầu, tiêu chảy, Mycoplasma, tụ huyết trùng, thương hàn gà, CRD, viêm tử cung","Liều: 10mg/kg bắp hoặc uống 3-5 ngày","Không dùng gà đẻ, heo con <1 tháng nếu không cần thiết (ảnh hưởng sụn khớp)"],benhTich:["Ảnh hưởng sụn khớp non nếu dùng kéo dài liều cao ở heo con, gà con","Không dùng gà đẻ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: 1ml/20kg bắp hoặc 1ml/10kg thể trọng hoặc 1ml/2 lít nước gà 3-5 ngày","Kết hợp Bromhexin long đờm nếu ho, men tiêu hóa nếu tiêu chảy","Không dùng kéo dài >5 ngày"],icovet:["Kết hợp Bromhexin, men tiêu hóa","Không dùng chung với Tetracyclin, Chloramphenicol"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 10 ngày, không dùng gà đẻ, heo con <1 tháng nếu không cần"]}),phongNgua:["Không dùng kéo dài >5 ngày, không dùng gà đẻ, heo con <1 tháng nếu không cần, bảo quản mát, đủ nước uống"]}},{id:"th6b",subId:"quino",group:"thuoc",name:"Flumequine 20% - Quinolone đường ruột thủy sản",sections:{gioiThieu:"Quinolone đường ruột, thủy sản, diệt E.coli, Edwardsiella, Aeromonas, dùng tiêu chảy, gan thận mủ cá, lươn, ếch.",nguyenNhan:"Cơ chế: như Enro, ức chế DNA gyrase, diệt khuẩn, phổ Gram âm đường ruột, thủy sản, hấp thu tốt qua ruột.",trieuChung:["Chỉ định: Tiêu chảy heo, gà, gan thận mủ cá, lươn, ếch, E.coli, Edwardsiella","Liều: 12mg/kg thể trọng trộn thức ăn 5-7 ngày","An toàn thủy sản"],benhTich:["An toàn thủy sản, ít độc gan thận"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Trộn thức ăn 2g/kg cám 5 ngày liên tục hoặc 1g/10 lít nước 3-5 ngày","Thủy sản: 1kg/tấn cám 5-7 ngày","Kết hợp men tiêu hóa A3"],icovet:["Pha nước hoặc trộn cám, dùng 5 ngày","Quản lý môi trường ao"],hanoi:["Theo Hà Nội + Thái Nguyên: Ngừng thuốc thịt 5 ngày, cá 3 ngày, bảo quản mát"]}),phongNgua:["Quản lý môi trường ao, không để nước bẩn, hữu cơ cao, bảo quản mát, không dùng quá 7 ngày"]}},{id:"th7a",subId:"kysinh",group:"thuoc",name:"BIVERMECTIN 0.1% Ivermectin - Kháng ký sinh trùng nội ngoại (ảnh thật)",sections:{gioiThieu:"Kháng ký sinh trùng nội ngoại phổ rộng, diệt giun tròn, ghẻ, rận, ve, ảnh bao bì BIVERMECTIN 0.1% thật, dùng heo, gà, trâu bò.",nguyenNhan:"Cơ chế: gắn kênh Cl-, tăng tính thấm Cl-, tê liệt thần kinh giun, ghẻ, rận, ve, không qua hàng rào máu não động vật có vú nên an toàn.",trieuChung:["Chỉ định: Giun đũa, giun lươn, giun tóc, giun kim, ghẻ Sarcoptes, rận Haematopinus, ve","Liều: 0.3ml/10kg thể trọng tiêm SC sau tai 1 lần, lặp lại sau 7-10 ngày nếu ghẻ nặng","An toàn, không dùng quá liều chó mèo nhỏ <5kg"],benhTich:["An toàn cao, LD50 cao, không dùng quá liều chó Collie, chó mèo nhỏ","Không dùng quá 0.5ml/10kg"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tiêm SC sau tai 0.3ml/10kg, 2 lần cách 7-10 ngày diệt ghẻ, giun, rận","Phun chuồng Hantox 1ml/lít diệt ghẻ, rận ngoài môi trường","Tẩy định kỳ 3 tháng/lần"],icovet:["Doramectin 1ml/33kg thay thế nếu kháng Ivermectin","Ủ phân, vệ sinh chuồng"],hanoi:["Theo Hà Nội + Thái Nguyên: Tẩy định kỳ 3 tháng/lần, vệ sinh chuồng, phát quang bụi rậm, không để phân tồn, ủ phân 60 ngày"]}),phongNgua:["Vệ sinh chuồng, phát quang bụi rậm, ủ phân 60 ngày, tẩy định kỳ 3 tháng/lần, không nhập heo ghẻ, rận, cách ly heo mới"]}},{id:"th7b",subId:"kysinh",group:"thuoc",name:"Toltrazuril 2.5% - Đặc trị cầu trùng heo gà",sections:{gioiThieu:"Đặc trị cầu trùng heo, gà, diệt tất cả giai đoạn nội bào và ngoại bào, hiệu quả cao, an toàn, dùng 1 lần.",nguyenNhan:"Cơ chế: ức chế men hô hấp ty thể, diệt tất cả giai đoạn cầu trùng (từ bào tử đến noãn nang), không ảnh hưởng miễn dịch, an toàn cao.",trieuChung:["Chỉ định: Cầu trùng heo con Isospora, gà Eimeria tenella, necatrix, acervulina ỉa máu","Liều: 20mg/kg thể trọng uống 1 lần duy nhất","An toàn cao, không độc"],benhTich:["An toàn cao, không độc gan thận, dùng được gà con, heo con 3 ngày tuổi"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Heo con 3-5 ngày tuổi: Baycox 5% 1ml/con uống 1 lần duy nhất phòng cầu trùng","Gà: 1ml/1 lít nước uống 2 ngày liên tục hoặc 7mg/kg 2 ngày","Kết hợp vệ sinh khô, phun Neopredisan"],icovet:["Baycox 2.5% hoặc 5% 1ml/con heo con 3-5 ngày tuổi","Amprolium phòng nếu không có Toltrazuril"],hanoi:["Theo Hà Nội + Thái Nguyên: Kết hợp vệ sinh khô, thay đệm lót, khò chuồng gas 80°C, để khô 2 ngày"]}),phongNgua:["Phòng lúc 3-5 ngày tuổi heo con 1ml/con, gà con 3 ngày tuổi, phun Neopredisan 1% diệt oocyst, đệm lót khô, không ướt"]}},{id:"th8a",subId:"vitamin",group:"thuoc",name:"ADE B12 + Gluco K-C - Trợ sức giải độc tăng đề kháng",sections:{gioiThieu:"Trợ sức, giải độc, tăng đề kháng, bù năng lượng, điện giải, vitamin, dùng trong mọi phác đồ virus, sau vaccine, stress.",nguyenNhan:"Cơ chế: Gluco bù năng lượng, K-C tăng đề kháng, ADE tăng sinh sản, miễn dịch, B12 tạo máu, men tiêu hóa tăng hấp thu.",trieuChung:["Chỉ định: Dùng trong mọi phác đồ virus (ASF, PRRS, Newcastle, Gumboro, PED, cúm), sau vaccine, stress nhiệt, vận chuyển, kém ăn","Liều: 1g/2 lít nước uống tự do 3-5 ngày hoặc tiêm Gluco K-C 5-10ml/con","An toàn, không tồn dư"],benhTich:["An toàn tuyệt đối, không có chống chỉ định, dùng được mọi lứa tuổi, nái chửa, heo con, gà con"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Pha nước uống tự do 1g/2 lít 3-5 ngày hoặc tiêm Gluco K-C 5-10ml/con bắp","Kết hợp men tiêu hóa Biozyme + Vitamin C 1g/lít","Tăng liều gấp đôi khi bệnh nặng, virus"],icovet:["Kết hợp men tiêu hóa, Vitamin C, điện giải Oresol","Dùng định kỳ sau stress"],hanoi:["Theo Hà Nội + Thái Nguyên: Tăng liều gấp đôi khi bệnh nặng, dùng liên tục 5-7 ngày, sau đó giảm liều duy trì"]}),phongNgua:["Dùng định kỳ sau stress, chuyển đàn, sau vaccine, mùa nóng, sau vận chuyển, khi bệnh, an toàn, không cần ngừng thuốc"]}},{id:"th8b",subId:"vitamin",group:"thuoc",name:"Vitamin C + Điện giải Oresol - Chống stress nhiệt",sections:{gioiThieu:"Chống stress nhiệt, tăng miễn dịch, chống oxy hóa, bù điện giải, dùng mùa nóng, sau vận chuyển, sốt cao.",nguyenNhan:"Cơ chế: Vitamin C chống oxy hóa, tăng interferon, tăng đề kháng, điện giải Na, K, Cl bù mất nước, Gluco bù năng lượng.",trieuChung:["Chỉ định: Stress nhiệt >32°C, sau vận chuyển, sốt cao, tiêu chảy mất nước, sau vaccine","Liều: 1g/5 lít nước uống tự do hoặc 2g/lít khi stress nặng","An toàn"],benhTich:["An toàn, không có chống chỉ định"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Pha nước uống hàng ngày mùa nóng 1g/5 lít, khi stress nặng 2g/5 lít + Gluco K-C","Kết hợp Oresol 1 gói/2 lít nước khi tiêu chảy mất nước","Tăng thông thoáng, phun sương, làm mát"],icovet:["Kết hợp Oresol + Gluco K-C + men","Cho uống tự do"],hanoi:["Theo Hà Nội + Thái Nguyên: Tăng thông thoáng, giảm mật độ, làm mát chuồng, phun sương, quạt"]}),phongNgua:["Dùng mùa nóng hàng ngày, sau vận chuyển, sau vaccine, khi sốt, tiêu chảy, an toàn, không cần ngừng thuốc"]}},{id:"th9a",subId:"khangviem",group:"thuoc",name:"Ketoprofen 10% - Kháng viêm NSAID hạ sốt giảm đau",sections:{gioiThieu:"Kháng viêm NSAID, hạ sốt, giảm đau, chống viêm, dùng sốt cao, viêm phổi, MMA, viêm khớp, đau.",nguyenNhan:"Cơ chế: ức chế COX-1, COX-2, giảm prostaglandin gây viêm, sốt, đau, ít tác dụng phụ hơn Dexa, không gây sảy thai.",trieuChung:["Chỉ định: Sốt cao >40.5°C, viêm phổi, MMA, viêm khớp, viêm vú, viêm tử cung, đau, què","Liều: 3mg/kg bắp 1 lần/ngày 1-3 ngày","Không dùng quá 3 ngày tránh loét dạ dày, suy thận nếu mất nước"],benhTich:["Không dùng quá 3 ngày, tránh loét dạ dày, suy thận nếu mất nước, không dùng nái sắp đẻ nếu không cần"],dieuTri:h({bacLieu:["Theo Bạc Liêu: 1ml/33kg bắp 1 lần/ngày 1-3 ngày, kết hợp kháng sinh Amoxi, Ceftiofur, Enro","Bù nước đầy đủ khi dùng NSAID, cho uống điện giải","Nếu sốt cao kéo dài kết hợp Paracetamol"],icovet:["Meloxicam 0.4mg/kg thay thế an toàn hơn nếu có","Không dùng chung với Dexa"],hanoi:["Theo Hà Nội + Thái Nguyên: Bù nước đầy đủ khi dùng NSAID, không dùng quá 3 ngày, theo dõi thận"]}),phongNgua:["Không dùng nái sắp đẻ nếu không cần, bù nước đầy đủ, không dùng quá 3 ngày, không dùng chung Dexa, bảo quản mát"]}},{id:"th9b",subId:"khangviem",group:"thuoc",name:"Dexamethasone 0.2% - Corticoid kháng viêm mạnh chống sốc",sections:{gioiThieu:"Corticoid kháng viêm mạnh, chống sốc, chống dị ứng, phù phổi, viêm nặng, cấp cứu, nhưng nhiều tác dụng phụ.",nguyenNhan:"Cơ chế: ức chế phospholipase A2, giảm viêm, dị ứng, ức chế miễn dịch, chống sốc, nhưng gây giữ muối nước, tăng đường huyết, ức chế miễn dịch, gây sảy thai nái chửa.",trieuChung:["Chỉ định: Sốc phản vệ, phù phổi, viêm nặng, dị ứng, viêm khớp nặng, MMA nặng","Liều: 0.2-0.5mg/kg bắp 1 lần duy nhất, không dùng kéo dài","Chống chỉ định: nái chửa (gây sảy), nhiễm trùng mủ, loét dạ dày, tiểu đường"],benhTich:["Không dùng nái chửa gây sảy thai, không dùng khi có mủ, nhiễm trùng huyết không có kháng sinh, gây loét dạ dày, teo tuyến thượng thận nếu dùng kéo dài"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Dùng 1 lần duy nhất trong cấp cứu sốc, phù phổi, dị ứng, kết hợp kháng sinh mạnh Ceftiofur hoặc Enro liều cao","Liều 0.2mg/kg, không dùng quá 1-2 lần","Thay bằng Ketoprofen nếu có thể để an toàn hơn"],icovet:["Thay bằng Ketoprofen hoặc Meloxicam nếu có thể để an toàn hơn","Chỉ dùng cấp cứu"],hanoi:["Theo Hà Nội + Thái Nguyên: Không dùng kéo dài, không dùng nái chửa, cân nhắc kỹ trước dùng, chỉ dùng khi thật cần"]}),phongNgua:["Cân nhắc kỹ trước dùng, không dùng nái chửa, không dùng khi có mủ, không dùng kéo dài, chỉ dùng cấp cứu, bảo quản mát"]}},{id:"luon1",subId:"luon",group:"thuysan",name:"Bệnh xuất huyết trên lươn",sections:{gioiThieu:"Bệnh xuất huyết cục bộ do tổn thương khi đánh bắt/vận chuyển, vi khuẩn cơ hội xâm nhập gây viêm, tuột da, hàm mang xung huyết.",nguyenNhan:"Tổn thương cơ học khi đánh bắt, vận chuyển; vi khuẩn cơ hội Aeromonas, Pseudomonas xâm nhập qua vết trầy; môi trường bẩn, oxy thấp, NH3 cao.",trieuChung:["Da xuất huyết cục bộ, viêm đỏ, tuột nhớt, vùng bụng và 2 bên thân rõ nhất, da lở loét","Hàm và mang xung huyết đỏ, phù","Lươn kém ăn, bơi lờ đờ gần bờ, tập trung góc bể"],benhTich:["Da xuất huyết, viêm hoại tử, mang xung huyết phù, nội tạng xung huyết nhẹ"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Lươn:","• Cách ly con bệnh, giảm mật độ ngay 50%","• Xử lý nước: IODINE 1ml/m3 hoặc BKC 0.5ml/m3 hoặc GLUTARANDEHYDE hoặc HERONANO 20-30 giọt/1000m3 theo liều an toàn","• Giảm ăn 50%, cho ăn BELU 3-5g/kg thức ăn liên tục 5-7 ngày để diệt khuẩn ruột","• Sau đó bổ sung men tiêu hóa A3 và ADE B12 3 ngày để nâng đề kháng, tăng oxy, thay 20-30% nước mỗi ngày"],icovet:[],hanoi:[]}),phongNgua:["Thao tác nhẹ nhàng khi đánh bắt, vận chuyển, không để trầy xước","Sát trùng bể trước khi thả bằng muối 3% 5 phút","Định kỳ bổ sung men A3 + khoáng + Vitamin C"]}},{id:"luon2",subId:"luon",group:"thuysan",name:"Bệnh đánh dấu, mục da, thối đuôi",sections:{gioiThieu:"Bệnh do Aeromonas dạng chấm tròn gây viêm hoại tử da lộ chân bì, thối đuôi, đuôi nát rụng dần.",nguyenNhan:"Aeromonas hydrophila dạng chấm tròn; nước hữu cơ cao, đáy bẩn, trầy xước da; mật độ dày >100 con/m2, oxy thấp.",trieuChung:["Trên da xuất hiện chấm tròn như hạt đậu nành, xung huyết đỏ, sau loét trắng","Da viêm hoại tử, loét lộ chân bì trắng, lộ xương nội tạng","Đuôi nát, rụng dần, cụt đuôi, bơi chậm, đầu vươn khỏi mặt nước, kém ăn"],benhTich:["Da loét sâu hoại tử, đuôi hoại tử xương lộ, gan thận sưng xuất huyết"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Lươn:","• Cách ly triệt để, vớt con nặng tiêu hủy","• Xử lý nước IODINE hoặc BKC hoặc GLUTARANDEHYDE liều an toàn cho lươn","• Giảm ăn 50%, cho ăn ANTIEHP A 1g/2kg thức ăn 3 ngày diệt khuẩn","• Tắm Oxytetra 200g/10m3 trong 30 phút, 2 ngày liên tiếp","• Đánh S10 20-30 giọt/1000m3 để diệt khuẩn đáy","• Sau liệu trình bổ sung A3 + ADE B12 3-5 ngày, giữ pH 6.5-7.5, NH3 <0.1"],icovet:[],hanoi:[]}),phongNgua:["Không để bùn đáy quá dày, siphon hàng ngày, tắm muối 3-5% trước khi thả 5 phút, bổ sung Vitamin C định kỳ, giảm mật độ"]}},{id:"luon3",subId:"luon",group:"thuysan",name:"Bệnh tuyến trùng ruột lươn",sections:{gioiThieu:"Tuyến trùng ký sinh ruột lươn, gây viêm ruột, tắc ruột, gầy, chết rải rác, phân trắng.",nguyenNhan:"Tuyến trùng Camallanus, Capillaria, Eustrongylides từ thức ăn tươi (cá tạp, ốc) không xử lý, nước bẩn.",trieuChung:["Lươn gầy, bụng to, ăn kém, phân trắng, có giun nhỏ đỏ trong phân","Bơi lờ đờ, chết rải rác, ruột chứa nhiều giun","Da nhợt, thiếu máu"],benhTich:["Ruột chứa nhiều giun tròn, đầu gai bám chặt niêm mạc, gan sưng, ruột viêm xuất huyết, mang nhợt"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Lươn:","• Xử lý nước IODINE hoặc muối 3%","• Giảm ăn, trộn Levamisol 2g/kg thức ăn hoặc Fenbendazole 2g/kg 2 ngày liên tiếp","• Kết hợp BELU 3g/kg 5 ngày + A3 + ADE B12","• Tẩy 2 lần cách 7 ngày, xử lý thức ăn tươi qua nước muối 3% trước khi cho ăn"],icovet:[],hanoi:[]}),phongNgua:["Tẩy giun định kỳ 1 tháng/lần bằng Levamisol, xử lý thức ăn tươi qua nước muối, không dùng nước ao tù, sát trùng bể"]}},{id:"luon4",subId:"luon",group:"thuysan",name:"Bệnh phát sốt nóng đỏ lươn",sections:{gioiThieu:"Bệnh phát sốt do vi khuẩn, virus khi nhiệt độ cao >30°C, nước bẩn, oxy thấp, lươn sốt, đỏ mình, chết nhanh.",nguyenNhan:"Vi khuẩn Aeromonas, Pseudomonas, Streptococcus khi nhiệt độ cao, nước hữu cơ cao, NH3 >0.2, oxy <3mg/l.",trieuChung:["Lươn sốt nóng mình, da đỏ toàn thân, xung huyết, bơi lờ đờ, nổi đầu","Kém ăn, chết nhanh sau 1-2 ngày sốt, chết 20-30%","Mang đỏ, phù, bụng trướng"],benhTich:["Toàn thân xung huyết, gan thận sưng đỏ, ruột viêm, mang phù"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Lươn:","• Giảm nhiệt độ bằng thay nước 50%, tăng oxy, quạt nước","• Xử lý nước HERONANO 20-30 giọt/1000m3 + IODINE 1ml/m3","• Giảm ăn 70%, cho ăn BELU 5g/kg + Vitamin C 2g/kg 5 ngày","• Bổ sung A3 + ADE B12 sau khi hết sốt"],icovet:[],hanoi:[]}),phongNgua:["Giữ nhiệt độ <28°C, thay nước hàng ngày 30%, tăng oxy, giảm mật độ mùa nóng, bổ sung Vitamin C định kỳ"]}},{id:"luon5",subId:"luon",group:"thuysan",name:"Bệnh ký sinh trùng ngoài (đỉa, trùng mỏ neo, sán)",sections:{gioiThieu:"Đỉa, trùng mỏ neo, sán lá, trùng bánh xe ký sinh da, mang lươn, gây ngứa, gầy, chết rải rác.",nguyenNhan:"Đỉa, Lernaea, Gyrodactylus, Trichodina từ nước bẩn, cá tạp, ốc, mật độ dày.",trieuChung:["Da có đốm trắng, đỉa bám, trùng mỏ neo cắm sâu, lươn ngứa cọ bể","Mang nhợt, thở nhanh, kém ăn, gầy","Chết rải rác, bơi lờ đờ"],benhTich:["Da, mang có ký sinh trùng bám, mang viêm, xuất huyết, da loét"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Lươn:","• Xử lý nước IODINE hoặc BROPONOL hoặc OXY VIÊN + YUCCA","• Tắm muối 3% 10 phút để rụng bớt ngoại ký sinh","• Trộn kháng S7 hoặc SHG + BELU 5-7 ngày diệt ký sinh trùng","• Bổ sung A3 + ADE B12 + HERONANO để hồi phục, vệ sinh dụng cụ, phơi bể"],icovet:[],hanoi:[]}),phongNgua:["Tẩy ký sinh định kỳ 1 tháng/lần bằng S7, xử lý thức ăn tươi qua nước muối, không dùng nước ao tù, tắm muối 2% định kỳ"]}},{id:"luon6",subId:"luon",group:"thuysan",name:"Bệnh nấm trên lươn",sections:{gioiThieu:"Nấm thủy mi Saprolegnia ký sinh vết thương và trứng lươn, gây bông trắng đầu và nát thịt, chết rải rác.",nguyenNhan:"Nấm thủy mi Saprolegnia ký sinh vết thương hở; nước lạnh <22°C, bẩn, giàu hữu cơ; trứng không thụ tinh bị nấm bám lây lan.",trieuChung:["Đầu lươn phủ lớp tơ khuẩn trắng như bông, xơ bông, vùng nấm ăn sâu làm thịt nát, loét trắng","Lươn kém ăn, bơi lờ đờ, chết rải rác","Trứng bị nấm trắng bao quanh, hỏng, không nở"],benhTich:["Da, đầu có đám nấm trắng, cơ hoại tử dưới đám nấm, trứng nấm trắng"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Lươn:","• Cách ly ngay, vớt con nấm nặng tiêu hủy","• Xử lý nước IODINE hoặc BROPONOL hoặc BKC hoặc GLUTARANDEHYDE liều an toàn cho lươn","• Tắm tẩy trùng: ngâm nước muối 3-5% 5-10 phút trước khi thả","• Dùng Bicacbonat natri 4% tắm 10 phút hoặc PROEXTRATIC 1ml/1m3 ngâm 15 phút rồi thay nước, lặp lại 2 ngày liên tiếp","• Giữ nhiệt độ >26°C, tăng muối 0.3% trong bể"],icovet:[],hanoi:[]}),phongNgua:["Sát trùng bể bằng IODINE trước vụ, không để lươn trầy xước khi vận chuyển, định kỳ tắm muối 2% 1 lần/tuần, giữ ấm >26°C"]}},{id:"ech1",subId:"ech",group:"thuysan",name:"1. Lợi ích của ếch - Vệ sĩ đồng ruộng",isArticle:!0,sections:{gioiThieu:"Ếch được mệnh danh vệ sĩ đồng ruộng – tiêu diệt côn trùng, báo hiệu thời tiết, giá trị thực phẩm cao, xuất khẩu.",nguyenNhan:"Ếch ăn ruồi, muỗi, sâu hại; thịt trắng, ít mỡ, giàu đạm; đùi ếch là đặc sản xuất khẩu. Ấn Độ năm 1981 xuất 4368 tấn đùi ếch.",trieuChung:["Tiêu diệt côn trùng: 1 đêm 1 ếch ăn 50-100 côn trùng, bảo vệ lúa","Báo mưa: ếch kêu to khi áp suất thay đổi trước mưa 1-2 ngày","Thực phẩm: thịt gà đồng, đùi ếch rán bơ nổi tiếng, giàu đạm 20%, ít mỡ","Xuất khẩu: Pháp, Mỹ ưa chuộng đùi ếch đông lạnh, giá cao"],benhTich:["Da ếch tiết chất kháng khuẩn, thịt nạc, giá trị dinh dưỡng cao"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Khai thác hợp lý, bảo vệ ếch đồng tự nhiên, phát triển nuôi để giảm áp lực đánh bắt, chế biến đùi ếch rán bơ, ếch xào lăn, cháo ếch"],icovet:[],hanoi:[]}),phongNgua:["Không dùng thuốc trừ sâu bừa bãi giết ếch, giữ bờ ruộng, ao hồ cho ếch trú ẩn, bảo tồn ếch đồng"]}},{id:"ech2",subId:"ech",group:"thuysan",name:"2. Hiện trạng nuôi ếch ở VN - Thủ phủ ĐBSCL",isArticle:!0,sections:{gioiThieu:"Đồng bằng sông Cửu Long là thủ phủ ếch, ếch tự nhiên cạn kiệt do thuốc BVTV, đánh bắt tận diệt, chuyển sang nuôi ếch Thái Lan nhập, ăn viên.",nguyenNhan:"Nhu cầu tăng, ếch đồng giảm 70% 10 năm qua do thuốc BVTV, đánh bắt tận diệt; ếch Thái Lan dễ nuôi, ăn viên 30-35% đạm, lớn nhanh, ít bệnh.",trieuChung:["An Giang: 147 cặp sinh sản, tỷ lệ đẻ 90%, nở 80%, sống nòng nọc 75%, giống 70%","Nhập thêm 300 cặp bố mẹ mới để tránh đồng huyết, cận huyết","TP.HCM 2005: 300 hộ nuôi, nhập 4 triệu giống + 8000 bố mẹ Thái Lan","Xu hướng nuôi bể xi măng 4-10m2, giai đăng, quầng trong ao, mật độ 100-150 con/m2"],benhTich:["Ếch đồng tự nhiên giảm 70% 10 năm qua","Nuôi nhân tạo tăng nhanh, hiệu quả kinh tế cao"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Chọn giống rõ nguồn, tránh cận huyết, ghi chép tỷ lệ đẻ, nở, sống, quản lý dịch bệnh tổng hợp, không lạm dụng kháng sinh, liên kết HTX bao tiêu"],icovet:[],hanoi:[]}),phongNgua:["Bảo tồn giống ếch đồng bản địa, kiểm dịch giống nhập, chọn giống khỏe, không dị tật"]}},{id:"ech3",subId:"ech",group:"thuysan",name:"3. Các loài ếch nuôi - Đồng, Thái Lan, Bò",isArticle:!0,sections:{gioiThieu:"3 loài chính nuôi ở VN: ếch đồng, ếch Thái Lan, ếch Bò Bullfrog Nam Mỹ, khác nhau kích cỡ, tập tính ăn, nguồn gốc.",nguyenNhan:"Khác nhau về kích cỡ, tập tính ăn, nguồn gốc, giá trị kinh tế, kỹ thuật nuôi.",trieuChung:["Ếch đồng: 150-200gr, ăn mồi di động (côn trùng sống), da vàng lợt, thịt thơm, giá cao nhưng chậm lớn, khó nuôi viên","Ếch Thái Lan: 200-400gr, lai Thái, ăn mồi tĩnh, ăn thức ăn viên 30-35% đạm, lớn nhanh, 3-4 tháng 200-300g, được nuôi phổ biến nhất","Ếch Bò (Bullfrog) Nam Mỹ: 500-900gr, to nhất, nuôi công nghiệp, cần kỹ thuật cao, ăn viên, giá cao, xuất khẩu"],benhTich:["Ếch Thái Lan được nuôi phổ biến nhất hiện nay ở ĐBSCL, chiếm 90%"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Chọn ếch Thái Lan cho nuôi thương phẩm, ếch đồng giữ làm giống quý, thức ăn viên nổi 2-3mm cho giống, 4mm cho thịt, phân cỡ thường xuyên tránh ăn nhau"],icovet:[],hanoi:[]}),phongNgua:["Không nuôi chung 3 loài cùng bể, chọn giống đồng đều, phân cỡ 7 ngày/lần"]}},{id:"ech4",subId:"ech",group:"thuysan",name:"4. Thị trường ếch - Xuất khẩu đùi đông lạnh",isArticle:!0,sections:{gioiThieu:"Thị trường đùi ếch quốc tế lớn, Pháp là nước nhập khẩu lớn nhất, giá cao, nhu cầu ổn định.",nguyenNhan:"Nhu cầu ẩm thực châu Âu, Mỹ, Nhật; đùi ếch là đặc sản, giàu đạm, ít mỡ, giá cao.",trieuChung:["Pháp 2000: nhập 7500 tấn đùi đông lạnh + 1000 tấn sống, tiêu thụ lớn nhất thế giới","Châu Âu tiêu thụ ~10 tấn/năm cho nghiên cứu, thực phẩm","Giá 2004: đông lạnh 10 USD/kg, sống 2.5 USD/kg, trong nước 35-50k/kg thịt, 5-8k/con giống","Đùi ếch chiếm 30% trọng lượng cơ thể, chế biến IQF, hút chân không"],benhTich:["Đùi ếch chiếm 30% trọng lượng cơ thể, giá trị xuất khẩu cao"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Nuôi theo tiêu chuẩn VietGAP để xuất khẩu, chế biến đùi đông lạnh IQF, đóng gói hút chân không, cấp đông -18°C, liên kết công ty xuất khẩu thủy sản"],icovet:[],hanoi:[]}),phongNgua:["Theo dõi giá thị trường, nuôi gối vụ, đảm bảo an toàn thực phẩm, không tồn dư kháng sinh, truy xuất nguồn gốc"]}},{id:"ech5",subId:"ech",group:"thuysan",name:"5. Đặc điểm sinh học ếch đồng - Lưỡng cư",isArticle:!0,sections:{gioiThieu:"Thế giới có 2000 loài ếch, da trần, máu lạnh, thở da, sống lưỡng cư, 15-16 năm tuổi thọ.",nguyenNhan:"Tiến hóa lưỡng cư, phụ thuộc nước để sinh sản, da trần dễ mất nước, máu lạnh thân nhiệt theo môi trường.",trieuChung:["Da trần vàng lợt, xanh oliu, có nốt sần, tiết nhớt, tiết chất kháng khuẩn","Sống ao hồ, ruộng, bờ bụi ẩm, sợ rắn, chuột, kim loại nặng, thuốc trừ sâu","Máu lạnh: thân nhiệt theo môi trường, ngủ đông bùn khi lạnh <10°C","Thở da 51% O2, 86% CO2 qua da + phổi, sống 15-16 năm tự nhiên","Mắt kém tinh, chỉ thấy mồi di động, đổi màu ngụy trang theo nền"],benhTich:["Da có tuyến độc nhẹ chống khuẩn, chân sau màng bơi, lưỡi dài dính"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Giữ bể nuôi ẩm, có chỗ cạn + nước 1/3, che mát 50%, không để nước nhiễm kim loại nặng, tạo hang hốc cho ếch trú ẩn"],icovet:[],hanoi:[]}),phongNgua:["Giữ môi trường sạch, không dùng thuốc BVTV gần bể, thay nước 30% hàng ngày, che mát, giữ ẩm"]}},{id:"ech6",subId:"ech",group:"thuysan",name:"6. Tập tính ăn uống - Săn mồi lưỡi phóng",isArticle:!0,sections:{gioiThieu:"Ếch ăn tạp, thích mồi động, có kỹ thuật săn mồi độc đáo bằng lưỡi phóng tia chớp, ăn đêm mạnh.",nguyenNhan:"Mắt chỉ nhận diện mồi di động, lưỡi dài dính phóng 10cm, dạ dày co bóp mạnh, ăn tạp nhưng thích mồi động.",trieuChung:["Thức ăn: cám gạo, bột ngô, ngũ cốc trộn cá, tôm, lươn, chạch băm, trùn quế, côn trùng","Thích cám gạo có canxi (vỏ tôm, cua) giúp tạo xương","Săn mồi: nhảy xa 1m, bơi giỏi, ngồi rình, phóng lưỡi nuốt chửng trong 0.1 giây","Ăn cua: dùng 2 tay vỗ lưng cua rồi nuốt, ăn đêm mạnh, ngày nghỉ"],benhTich:["Lưỡi dài dính, phóng 10cm, dạ dày co bóp mạnh, ruột ngắn"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Cho ăn 2 lần/ngày sáng chiều, 5-8% trọng lượng, tập ăn viên bằng cách cho ăn kèm cá sống 3 ngày đầu, bổ sung men A3 + ADE B12 giúp tiêu hóa, vớt thức ăn thừa sau 30 phút tránh thối nước"],icovet:[],hanoi:[]}),phongNgua:["Phân cỡ, cho ăn đều, tránh ăn lẫn nhau, bổ sung canxi 2% khẩu phần, đủ đạm 30-35%"]}},{id:"ech7",subId:"ech",group:"thuysan",name:"7. Sinh trưởng - 3-4 tháng thương phẩm",isArticle:!0,sections:{gioiThieu:"Tăng trưởng nhanh, 3-4 tháng đạt thương phẩm 100-300g, ăn lẫn nhau khi đói, phân cỡ quan trọng.",nguyenNhan:"Ăn nhiều, chuyển hóa tốt nếu đủ đạm 30-35%, nhiệt độ 28-32°C, oxy đủ, nước sạch.",trieuChung:["Giống 3-5g sau 1 tháng 25-30g, 2 tháng 80-100g, 3-4 tháng 200-300g thương phẩm Thái Lan","Tự nhiên: 1 tuổi cái 60g, đực 50g","Tăng trọng 5-7g/ngày giai đoạn 1-3 tháng","Ăn lẫn nhau khi đói, phân cỡ quan trọng, tỷ lệ sống 70% nếu quản lý tốt"],benhTich:["Tăng trọng nhanh nếu đủ đạm, ấm, sạch"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Phân cỡ 7 ngày/lần, tách lớn nhỏ, cho ăn đủ không để đói, bổ sung khoáng, Vitamin C, mật độ 100-150 con/m2 giống, 50-80 con/m2 thịt"],icovet:[],hanoi:[]}),phongNgua:["Giữ nước sạch, đủ oxy, không nuôi quá dày, phân cỡ thường xuyên, cho ăn đủ, che mát"]}},{id:"ech8",subId:"ech",group:"thuysan",name:"8. Sinh sản - Mùa mưa tháng 3-7",isArticle:!0,sections:{gioiThieu:"Sinh sản mùa mưa, đẻ tháng 3-7 âm lịch, thụ tinh ngoài, trứng nổi thành màng trên mặt nước, 7-10 ngày nở nòng nọc.",nguyenNhan:"Kích thích bởi mưa rào, tiếng kêu gọi bạn tình, áp suất thay đổi, nhiệt độ 25-30°C, ẩm 80%.",trieuChung:["Mùa đẻ: tháng 3-7 âm lịch, đêm mưa rào, đực kêu 2 túi kêu phồng to, có chai tay sinh dục ôm nách cái","Thụ tinh ngoài: trứng tròn 2 cực đen trắng, nổi thành màng trên mặt nước, 2500-5000 trứng/con/năm","7-10 ngày nở thành nòng nọc thở mang, 30-40 ngày mọc chân, rụng đuôi biến thành ếch con","1 tuổi 50-60g bắt đầu sinh sản"],benhTich:["Nòng nọc ăn phù du, tảo, lòng đỏ trứng, cám mịn"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Chọn bố mẹ 200-300g khỏe không dị tật, tỉ lệ đực:cái 1:1.2, kích thích đẻ bằng mưa nhân tạo phun nước, bể đẻ 2m2 nước 15cm có giá thể bèo, thu trứng ấp riêng tránh ếch bố mẹ ăn trứng"],icovet:[],hanoi:[]}),phongNgua:["Không để ếch đẻ tự do trong bể thịt, tách trứng, nòng nọc riêng, giữ nước sạch, ấm 28°C"]}},{id:"ech9",subId:"ech",group:"thuysan",name:"9. Ếch Thái Lan 3 giai đoạn - Nòng nọc, giống, trưởng thành",isArticle:!0,sections:{gioiThieu:"Ếch Thái Lan có 3 giai đoạn rõ rệt, khác ếch đồng, ăn viên 100%, lớn nhanh, tỷ lệ sống cao.",nguyenNhan:"Chọn lọc giống Thái Lan ăn viên, lớn nhanh, thích nghi bể xi măng, ăn viên nổi.",trieuChung:["Giai đoạn 1 - Nòng nọc 21-28 ngày: sống hoàn toàn trong nước, ăn phù du, tảo, cám mịn, lòng đỏ trứng, thở mang, mật độ 5000 con/m2","Giai đoạn 2 - Giống 2-50g: sống cạn gần nước, ăn côn trùng, giun, ốc, tập ăn viên 40% đạm, ăn lẫn nhau khi thiếu thức ăn, phân cỡ liên tục","Giai đoạn 3 - Trưởng thành 200-300g sau 8-10 tháng: đẻ, ăn viên 100% 30% đạm, ít ăn nhau, tỷ lệ sống cao hơn ếch đồng nếu đủ thức ăn, nước cạn 3-5cm"],benhTich:["Chuyển từ thở mang sang thở phổi, da, 3 giai đoạn rõ rệt"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Giai đoạn nòng nọc cho ăn lòng đỏ trứng + cám mịn + tảo, giống cho ăn trùn quế, cá băm + tập viên 40% đạm, phân cỡ nòng nọc giống liên tục, giữ nước cạn 3-5cm cho giống thay 50% mỗi ngày, che lưới chống chim rắn"],icovet:[],hanoi:[]}),phongNgua:["Không để nòng nọc quá dày >5000 con/m2, che lưới chống chim, rắn, chuột, giữ ấm 28°C, đủ oxy"]}},{id:"ech10",subId:"ech",group:"thuysan",name:"10. Các mô hình nuôi - Ao đất, bể xi măng, giai đăng",isArticle:!0,sections:{gioiThieu:"3 mô hình chính: ao đất, bể xi măng, giai đăng/quầng trong ao, tùy điều kiện đất đai, vốn, nguồn nước.",nguyenNhan:"Tùy điều kiện đất đai, vốn, nguồn nước, kinh nghiệm, thị trường.",trieuChung:["Ao đất: diện tích 50-200m2, bờ cao 1m, có lưới vây cao 1.2m chôn 20cm chống chuột rắn, nước 20-30cm, có gò đất cho ếch lên bờ, chi phí thấp, khó quản lý dịch bệnh, năng suất thấp","Bể xi măng: 4-10m2, cao 1m, đáy nghiêng 2%, ống xả đáy, dễ vệ sinh, thay nước, quản lý dịch bệnh tốt, nuôi mật độ cao 100-150 con/m2, được ưa chuộng nhất hiện nay ở ĐBSCL","Giai đăng/quầng trong ao: khung tre/nilon nổi trong ao, tận dụng ao sẵn có, thoáng mát, chi phí trung bình, dễ thu hoạch, năng suất trung bình"],benhTich:["Bể xi măng được ưa chuộng nhất hiện nay ở ĐBSCL, chiếm 70% hộ nuôi"],dieuTri:h({bacLieu:["\\uD83D\\uDCC4 Theo tài liệu Ếch: Bể xi măng lót bạt, tạo độ dốc 2%, ống xả đáy, ao đất rào lưới cước cao 1.2m chôn 20cm chống chuột rắn, che mát 50% bằng lưới đen trồng bèo 20% mặt nước, sát trùng bể bằng vôi 10kg/100m2 trước vụ 7 ngày"],icovet:[],hanoi:[]}),phongNgua:["Chọn mô hình phù hợp vốn, giữ an toàn lưới chống chim, rắn, chuột, sát trùng bể trước vụ, không nuôi quá dày"]}},{id:"bo1",subId:"bo",group:"giasuc",name:"Tụ huyết trùng trâu bò",sections:{gioiThieu:"Bệnh truyền nhiễm cấp tính trâu bò do Pasteurella multocida type B, E, thường nổ ra sau stress vận chuyển, mưa nắng thất thường, tỷ lệ chết 80-100% nếu không cấp cứu.",nguyenNhan:"Pasteurella multocida type B, E tồn tại sẵn ở hầu họng, khi stress sức đề kháng giảm vi khuẩn xâm nhập máu gây nhiễm trùng huyết, độc tố. Lây qua tiếp xúc, không khí, ve, ruồi.",trieuChung:["Sốt cao 41-42°C, bỏ ăn, ủ rũ, thở khó, chảy nước mũi, dãi","Phù thủng hầu họng, yếm, ức to, sờ nóng đau, thở khò khè","Chết nhanh 12-24h nếu thể quá cấp, mũi chảy bọt lẫn máu"],benhTich:["Phổi viêm xuất huyết, phù keo vàng vùng hầu họng, hạch sưng xuất huyết","Tim xuất huyết, gan sưng, lách to"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Streptomycin 20mg/kg + Penicillin G 20.000 UI/kg bắp 3-5 ngày, hoặc Enrofloxacin 10% 1ml/20kg + Ketoprofen 3mg/kg","Trợ sức Gluco K-C 10ml/100kg + Vitamin C liều cao + Cafein","Chườm lạnh vùng phù ngày đầu, truyền dịch nếu mất nước"],icovet:["Ceftiofur 3mg/kg + Ketoprofen 3 ngày","Tách riêng con bệnh, sát trùng chuồng bằng vôi bột"],hanoi:["Theo Hà Nội + Thái Nguyên: Kháng sinh phổ rộng sớm, hạ sốt, giảm phù, theo dõi thở, không vận chuyển khi đang sốt"]}),phongNgua:["Vaccine tụ huyết trùng trâu bò 2 lần/năm (tháng 3 và 9), liều 2-3ml/con tiêm dưới da","Giảm stress vận chuyển, che mưa nắng, bổ sung Vitamin C + điện giải khi chuyển đàn","Cách ly trâu bò mới 15 ngày, sát trùng chuồng, diệt ruồi"]}},{id:"bo2",subId:"bo",group:"giasuc",name:"Lở mồm long móng FMD bò",sections:{gioiThieu:"Bệnh mụn nước ở mồm, chân, vú do Aphthovirus type O, A, Asia1, lây cực nhanh qua không khí, người, xe, thịt sữa.",nguyenNhan:"FMD virus Picornaviridae, tồn tại trong thịt, sữa, môi trường 1 tháng, lây qua không khí 10km, qua người, xe, chim, chuột.",trieuChung:["Sốt 40-41°C, bỏ ăn, chảy dãi nhớt kéo sợi, lưỡi, nướu, môi có mụn nước to như hạt đậu, sau vỡ loét đỏ","Kẽ móng, vành móng mụn nước, sau vỡ loét, què, nằm không đi, vú có mụn nước","Bò sữa giảm sữa 50-70%, bê nghé chết do viêm cơ tim hổ vằn"],benhTich:["Mụn nước vỡ loét niêm mạc miệng, lưỡi, kẽ móng, vú, tim bê vệt trắng hổ vằn","Chân loét, móng long"],dieuTri:h({bacLieu:["Theo Bạc Liêu: KHÔNG có thuốc đặc trị virus, chỉ điều trị triệu chứng","Rửa vết loét bằng phèn chua 3% hoặc chanh, muối, sau bôi xanh methylen + glycerin + mật ong, bôi mỡ kẽm kẽ móng","Kháng sinh Pen-Strep + Ketoprofen chống bội nhiễm móng, cho ăn cháo loãng, cỏ non mềm","Tăng đề kháng ADE + Gluco K-C + Vitamin C"],icovet:["Vaccine FMD type O, A, Asia1 2 lần/năm, liều 2ml/con","Cách ly 21 ngày, phun vôi bột, NaOH 2%"],hanoi:["Theo Hà Nội + Thái Nguyên: Cách ly, sát trùng chân người bằng vôi, không bán chạy, báo dịch"]}),phongNgua:["Vaccine FMD định kỳ 6 tháng/lần, không nhập bò vùng dịch, cách ly bò mới 30 ngày, an toàn sinh học, không mua thịt chợ cho chó ăn"]}},{id:"bo3",subId:"bo",group:"giasuc",name:"Viêm vú bò sữa",sections:{gioiThieu:"Viêm tuyến vú do Strep agalactiae, Staph aureus, E.coli, Klebsiella do vắt sữa không vệ sinh, máy vắt bẩn, chuồng ẩm, tỷ lệ mắc 20-40% đàn bò sữa.",nguyenNhan:"Vi khuẩn xâm nhập qua ống vú khi vắt sữa sai kỹ thuật, không sát trùng núm vú, chuồng bẩn, vắt không kiệt sữa, chấn thương vú.",trieuChung:["Vú sưng nóng đỏ đau, 1/4 vú hoặc cả vú căng cứng, sốt 40-41°C nếu cấp","Sữa vón cục như bã đậu, có máu, mủ, loãng vàng, giảm sữa","Bò bỏ ăn, ủ rũ nếu viêm nặng"],benhTich:["Tuyến vú viêm, có mủ, bã đậu, ống dẫn sữa tắc, hạch trên vú sưng","Sữa biến đổi, không đông tụ bình thường"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Vắt kiệt sữa viêm bỏ, chườm ấm 40°C + massage, thụt rửa vú bằng kháng sinh nhũ tương vú (Mastijet, Cobactan LC) ngày 2 lần 3 ngày","Tiêm toàn thân Amoxi LA 15mg/kg + Gentamycin 4mg/kg + Ketoprofen 3mg/kg 3 ngày","Bổ sung Gluco K-C + ADE, vệ sinh vú bằng iod 0.5% trước và sau vắt"],icovet:["Kháng sinh nhũ tương vú chứa Amoxicillin + Clavulanic hoặc Ceftiofur","Vệ sinh máy vắt, tay người vắt"],hanoi:["Theo Hà Nội + Thái Nguyên: Vệ sinh chuồng khô, lót rơm sạch, sát trùng núm vú sau vắt bằng Dip, CMT test hàng tuần phát hiện sớm"]}),phongNgua:["Vệ sinh vắt sữa đúng: rửa vú nước ấm, lau khô khăn riêng, sát trùng núm vú sau vắt bằng iod 0.5%","Máy vắt vệ sinh, chuồng khô sạch, test CMT 1 lần/tuần, loại thải bò viêm mãn tính","Vaccine Staph, Strep nếu có, bổ sung ADE + Selen tăng đề kháng vú"]}},{id:"bo4",subId:"bo",group:"giasuc",name:"Chướng hơi dạ cỏ",sections:{gioiThieu:"Bệnh chướng hơi dạ cỏ do ăn nhiều cỏ non họ đậu, thức ăn lên men sinh hơi nhanh, liệt dạ cỏ không ợ hơi được, bò trâu đều mắc, chết nhanh do ngạt nếu không cấp cứu.",nguyenNhan:"Ăn nhiều cỏ non, rau muống, bèo, thức ăn tinh bột lên men nhanh, cỏ có sương, nước mưa, liệt nhu động dạ cỏ do ăn lạnh, stress, tắc thực quản.",trieuChung:["Bụng trái căng to nhanh sau ăn 1-2h, gõ kêu vang như trống, hõm hông trái phồng cao hơn phải","Khó thở, thở nhanh, tim đập nhanh, lưỡi thè, sùi bọt mép, không ợ hơi, không nhai lại","Nặng thì nằm nghiêng, bụng căng như trống, chết sau 3-6h do chèn ép tim phổi"],benhTich:["Dạ cỏ căng hơi, chứa nhiều bọt khí, thức ăn lên men, niêm mạc xung huyết","Phổi xẹp do chèn ép"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Cho bò đứng dốc đầu cao, xoa bóp hõm hông trái, kéo lưỡi cho ợ hơi, cho uống 200-300ml dầu ăn + 1 lít bia + 100g Mag sulfat để phá bọt","Nếu nặng chọc trocar thoát hơi ở hõm hông trái: sát trùng, chọc trocar hướng xuống, để hơi xì từ từ, đặt ống 2-3h","Sau thoát hơi cho uống men tiêu hóa + B.complex + Gluco K-C, kiêng cỏ non 2-3 ngày, cho ăn rơm khô"],icovet:["Dầu parafin 200ml + chống bọt Poloxalene","Truyền dịch nếu mất nước"],hanoi:["Theo Hà Nội + Thái Nguyên: Không cho bò ăn cỏ ướt sương, cỏ họ đậu non quá nhiều, cho ăn rơm trước khi thả đồng, theo dõi sau ăn"]}),phongNgua:["Không chăn thả lúc cỏ còn ướt sương, mưa, không cho ăn quá nhiều cỏ non họ đậu (cỏ stylo, keo dậu)","Cho ăn rơm khô trước khi thả, bổ sung muối + men tiêu hóa, không để bò đói rồi ăn bù","Trồng cỏ hỗn hợp, luân phiên bãi chăn"]}},{id:"bo5",subId:"bo",group:"giasuc",name:"Sán lá gan bò",sections:{gioiThieu:"Bệnh sán lá gan do Fasciola gigantica, hepatica ký sinh ống mật gan, gây gầy yếu, thiếu máu, phù, giảm sữa, trâu bò đồng bằng dễ nhiễm 30-60%.",nguyenNhan:"Ăn cỏ, uống nước có ấu trùng sán bám trên rau thủy sinh, ốc Lymnaea là ký chủ trung gian, vòng đời 3-4 tháng, sán trưởng thành đẻ trứng theo phân ra môi trường.",trieuChung:["Gầy yếu dần, lông xù, da khô, thiếu máu niêm mạc nhợt, phù hàm (bầu hàm), phù yếm, phù ức, bụng to","Ỉa chảy kéo dài, phân loãng có lẫn trứng sán, giảm sữa 20-40%, còi cọc","Nặng gan sưng to, đau khi ấn vùng gan phải"],benhTich:["Gan sưng to, xơ hóa, ống mật dày, chứa sán lá dẹp như lá, màu nâu hồng, gan có đường đi của sán","Túi mật to, có sán, máu loãng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tẩy bằng Triclabendazole 12mg/kg thể trọng uống 1 lần (Fasinex) hiệu quả cả sán non và trưởng thành, hoặc Albendazole 15mg/kg + Ivermectin nếu ghép giun tròn","Bổ sung sắt + B12 + ADE + men gan Hepaton + Gluco K-C 5 ngày, cho ăn cỏ sạch, không chăn thả ruộng ngập","Tẩy 2 lần/năm đầu và cuối mùa mưa"],icovet:["Triclabendazole 12mg/kg 1 lần duy nhất","Diệt ốc bằng vôi bột, quản lý phân"],hanoi:["Theo Hà Nội + Thái Nguyên: Ủ phân 60 ngày diệt trứng sán, không cho trâu bò uống nước ao tù có ốc, phát quang bờ ao"]}),phongNgua:["Tẩy sán định kỳ 2 lần/năm bằng Triclabendazole, ủ phân 60 ngày, diệt ốc bằng vôi, không chăn thả ruộng ngập nước có ốc","Cho uống nước sạch, không ăn rau thủy sinh sống, bổ sung khoáng + Vitamin ADE tăng đề kháng gan"]}},{id:"trau1",subId:"trau",group:"giasuc",name:"Tiên mao trùng Trypanosoma trâu bò",sections:{gioiThieu:"Bệnh do Trypanosoma evansi ký sinh máu trâu bò, do ruồi trâu, mòng truyền, sốt từng cơn, thiếu máu, thủy thũng, tỷ lệ chết 20-40% nếu không điều trị.",nguyenNhan:"Trypanosoma evansi ký sinh hồng cầu, lây qua ruồi trâu (Tabanus), mòng hút máu, truyền cơ học, mùa mưa nhiều ruồi bệnh bùng phát.",trieuChung:["Sốt từng cơn 40-41°C, sốt 2-3 ngày rồi hạ, 5-7 ngày sốt lại, gầy dần, thiếu máu niêm mạc nhợt, mắt lõm","Phù thủy thũng: phù yếm, ức, bụng, 4 chân, đái ít, nước tiểu vàng","Ỉa chảy, giảm sữa, sảy thai, liệt chân sau nếu nặng"],benhTich:["Máu loãng, khó đông, lách to, gan sưng, hạch sưng, dịch xoang bụng vàng","Phù keo vàng dưới da yếm, ức"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Trypamidium (Isometamidium) 0.5-1mg/kg bắp sâu hoặc Naganol (Suramin) 10mg/kg tĩnh mạch chậm, liều duy nhất, lặp lại sau 30 ngày nếu còn ký sinh trùng","Trợ sức sắt + B12 + ADE + Gluco K-C + truyền dịch, cho ăn cỏ non, bổ sung đạm","Diệt ruồi trâu bằng bẫy, phun Cypermethrin chuồng trại"],icovet:["Diminazene aceturate 3.5mg/kg + Vitamin B12","Phòng ruồi"],hanoi:["Theo Hà Nội + Thái Nguyên: Điều trị sớm khi sốt từng cơn, không để gầy quá, bổ sung dinh dưỡng, diệt ruồi, cách ly trâu bệnh"]}),phongNgua:["Diệt ruồi trâu, mòng bằng bẫy keo, phun Cypermethrin 1ml/lít chuồng trại, phát quang bụi rậm","Không chăn thả gần rừng rậm nhiều ruồi, bổ sung Vitamin C + ADE tăng đề kháng, kiểm tra máu định kỳ mùa mưa"]}},{id:"trau2",subId:"trau",group:"giasuc",name:"Bệnh do ve, ghẻ, mò trâu bò",sections:{gioiThieu:"Ve Boophilus, ghẻ Sarcoptes, mò Psoroptes hút máu trâu bò gây gầy, thiếu máu, ngứa, rụng lông, giảm sữa, trung gian truyền tiên mao trùng, lê dạng trùng.",nguyenNhan:"Ve, ghẻ, mò ký sinh da, hút máu, đẻ trứng ở chuồng, khe tường, mùa nóng ẩm phát triển mạnh, lây qua tiếp xúc, chuồng bẩn.",trieuChung:["Ngứa dữ, cọ tường, cọ cọc, rụng lông từng mảng, da dày, đóng vảy trắng xám, có mụn mủ","Gầy, thiếu máu, da nhợt, ve bám nhiều ở tai, yếm, bẹn, kẽ chân, hút máu đêm","Giảm sữa, chậm lớn, còi"],benhTich:["Da viêm, ghẻ đào hang, ve bám hút máu, da dày nứt nẻ, có trứng, ấu trùng ve dưới kính","Máu loãng nếu ve nhiều"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Ivermectin 1% 0.2ml/10kg tiêm dưới da sau tai 2 lần cách 7 ngày diệt cả ve ghẻ nội ngoại, hoặc Doramectin 1ml/50kg","Phun chuồng Cypermethrin 1ml/lít hoặc Hantox 1ml/2 lít diệt ve ghẻ ngoài môi trường, đốt rơm lót, rắc vôi bột, tắm trâu bò bằng dung dịch Hantox","Bổ sung sắt + B12 nếu thiếu máu, kẽm + ADE hồi phục da"],icovet:["Ivermectin + phun chuồng","Vệ sinh chuồng"],hanoi:["Theo Hà Nội + Thái Nguyên: Tẩy ve ghẻ định kỳ 3 tháng/lần, vệ sinh chuồng khô, phát quang, không để trâu bò nằm chỗ ẩm"]}),phongNgua:["Tẩy ve ghẻ định kỳ 3 tháng/lần bằng Ivermectin, phun chuồng định kỳ, tắm trâu bò bằng Hantox 1 lần/tháng, phát quang bụi rậm, giữ chuồng khô sạch"]}},{id:"trau3",subId:"trau",group:"giasuc",name:"Ngộ độc cỏ, thức ăn trâu bò",sections:{gioiThieu:"Ngộ độc do trâu bò ăn cỏ phun thuốc trừ sâu, lá sắn, cỏ sữa, cỏ lào, thức ăn mốc, urea quá liều, chết nhanh nếu không cấp cứu.",nguyenNhan:"Cỏ phun thuốc trừ sâu chưa cách ly đủ 14-21 ngày, lá sắn chứa HCN, cỏ sữa, cỏ lào chứa độc, thức ăn mốc aflatoxin, urea cho ăn quá 1% khẩu phần hoặc không quen.",trieuChung:["Co giật, run cơ, sùi bọt mép, chảy dãi, đồng tử co nhỏ hoặc giãn to, thở nhanh, bụng chướng","Ỉa chảy phân đen, có máu nếu ngộ độc thuốc trừ sâu, chết nhanh 2-6h nếu ngộ độc nặng","Nếu ngộ độc HCN lá sắn: thở nhanh, máu đỏ tươi không đông, chết cấp"],benhTich:["Dạ cỏ chứa cỏ xanh có mùi thuốc trừ sâu, niêm mạc dạ cỏ, ruột xuất huyết, gan sưng, thận sưng","Máu đỏ tươi nếu ngộ độc HCN"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Ngừng ngay thức ăn nghi ngộ độc, cho uống than hoạt tính 100g + Mag sulfat 200g + nước 2 lít để hấp thu độc và tẩy","Giải độc: Atropin 0.5mg/kg nếu ngộ độc lân hữu cơ, tiêm bắp, lặp lại 30 phút/lần đến khi hết co giật, truyền dịch Gluco 5% + Cafein + Vitamin C liều cao","Nếu ngộ độc HCN lá sắn: tiêm Natri thiosulfat 20% 50ml tĩnh mạch chậm + cho uống đường Gluco","Trợ tim Cafein, giữ ấm, không cho ăn 12h"],icovet:["Than hoạt + Mag sulfat + truyền dịch","Atropin nếu ngộ độc thuốc trừ sâu"],hanoi:["Theo Hà Nội + Thái Nguyên: Rửa dạ cỏ bằng ống thông nếu mới ăn <2h, cho uống nước đường, không để trâu bò đói ăn bậy, quản lý cỏ"]}),phongNgua:["Không chăn thả bãi cỏ mới phun thuốc <21 ngày, không cho ăn lá sắn tươi quá 30% khẩu phần, phơi héo lá sắn 2-3 nắng trước khi cho ăn","Bảo quản thức ăn khô ráo, không mốc, cho ăn urea từ từ 1-2% khẩu phần, trộn đều, tập dần 7 ngày","Trồng cỏ sạch, có hàng rào, biển báo bãi cỏ phun thuốc"]}},{id:"de1",subId:"de",group:"giasuc",name:"Đậu dê/cừu",sections:{gioiThieu:"Bệnh đậu do Poxvirus gây mụn đậu da, niêm mạc, sốt, biếng ăn, dê con chết 20-40%, lây qua tiếp xúc, ruồi, gió.",nguyenNhan:"Goatpox, Sheeppox virus, lây qua tiếp xúc mụn đậu, không khí, ruồi, tồn tại vảy đậu 6 tháng, mùa đông xuân hay nổ ra.",trieuChung:["Sốt 41-42°C, bỏ ăn, chảy nước mắt, nước mũi, mụn đậu đỏ ở môi, mũi, quanh mắt, tai, bẹn, vú, đuôi, sau thành mụn mủ, vảy đen","Mụn đậu niêm mạc miệng, mũi, gây khó thở, khó ăn","Dê con chết 20-40%, dê lớn gầy, giảm sữa"],benhTich:["Da có mụn đậu qua các giai đoạn đỏ, mụn nước, mụn mủ, vảy đen, niêm mạc miệng, khí quản, phổi có nốt đậu","Phổi viêm, hạch sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: KHÔNG có thuốc đặc trị virus, chăm sóc vết loét: rửa bằng nước muối 0.9% + bôi xanh methylen + glycerin, không bóc vảy","Kháng sinh Pen-Strep + Ketoprofen chống bội nhiễm, Gluco K-C + Vitamin C + ADE tăng đề kháng, cho ăn cỏ non mềm, cháo","Cách ly dê bệnh, sát trùng chuồng bằng vôi bột + Virkon, đốt vảy đậu"],icovet:["Vaccine đậu dê/cừu 1 lần/năm 0.5ml/con dưới da, phòng 1 năm","Sát trùng chuồng"],hanoi:["Theo Hà Nội + Thái Nguyên: Cách ly 30 ngày, không bán chạy, tăng dinh dưỡng, giữ ấm, chống ruồi"]}),phongNgua:["Vaccine đậu dê/cừu 1 lần/năm vào tháng 9-10 trước mùa đông, liều 0.5ml/con dưới da","Cách ly dê mới 30 ngày, sát trùng chuồng, đốt vảy đậu, diệt ruồi, không nhập dê vùng dịch"]}},{id:"de2",subId:"de",group:"giasuc",name:"Viêm phổi dê/cừu",sections:{gioiThieu:"Viêm phổi do Pasteurella, Mycoplasma ovipneumoniae, Mannheimia do lạnh, ẩm, gió lùa, nhốt chật, dê con 1-3 tháng dễ mắc, chết 20-30%.",nguyenNhan:"Pasteurella multocida, Mannheimia haemolytica, Mycoplasma, stress lạnh, ẩm, gió lùa, bụi, ghép đàn, vận chuyển xa, dinh dưỡng kém.",trieuChung:["Sốt 40.5-41.5°C, ho khan, sau ho có đờm, chảy nước mũi đặc vàng xanh, thở nhanh, thở bụng, há mồm","Bỏ ăn, ủ rũ, gầy, lông xù, nằm nhiều","Chết 20-30% nếu không điều trị sớm, dê khỏi còi cọc"],benhTich:["Phổi gan hóa đỏ, xám, có mủ, dính sườn, màng phổi phủ fibrin vàng","Hạch phổi sưng, khí quản có dịch mủ"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tylosin 10mg/kg + Gentamycin 4mg/kg hoặc Enrofloxacin 10% 1ml/20kg + Bromhexin long đờm 0.5ml/10kg 3-5 ngày","Hạ sốt Ketoprofen 3mg/kg + Gluco K-C + Vitamin C + giữ ấm chuồng bằng rơm, che gió lùa, giảm mật độ","Cho uống nước ấm + muối + đường, cỏ non mềm"],icovet:["Tulathromycin 2.5mg/kg 1 liều + Ketoprofen","Vaccine tụ huyết trùng dê"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ ấm chuồng, không để gió lùa, mưa hắt, lót rơm khô, thông thoáng, không nhốt quá chật"]}),phongNgua:["Giữ chuồng ấm, khô, kín gió lùa, lót rơm khô, không nhốt quá dày <2 con/m2","Vaccine tụ huyết trùng dê/cừu 2 lần/năm, bổ sung ADE + Vitamin C mùa lạnh, không vận chuyển xa khi trời lạnh","Cách ly dê mới, sát trùng chuồng"]}},{id:"de3",subId:"de",group:"giasuc",name:"Tụ huyết trùng dê/cừu",sections:{gioiThieu:"Bệnh cấp tính do Pasteurella multocida, Mannheimia haemolytica, chết nhanh 24h, tỷ lệ chết 50-80%, dê con, dê chửa dễ chết nhất.",nguyenNhan:"Như trâu bò nhưng cấp tính hơn do dê sức đề kháng kém, stress vận chuyển, lạnh, ẩm, ghép đàn, bụi cao.",trieuChung:["Sốt cao 41-42°C đột ngột, bỏ ăn, ủ rũ, thở khó, há mồm, chảy nước mũi bọt máu","Phù hầu họng, yếm, ỉa chảy phân đen, chết nhanh 12-24h","Dê chửa sảy thai"],benhTich:["Phổi xuất huyết, phù keo vàng vùng hầu họng, hạch sưng xuất huyết, tim xuất huyết","Gan, lách sưng, ruột xuất huyết"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Kháng sinh mạnh sớm: Enrofloxacin 10% 1ml/15kg + Streptomycin 20mg/kg hoặc Ceftiofur 3mg/kg + Ketoprofen 3mg/kg 3-5 ngày","Trợ sức Gluco K-C + Vitamin C + Cafein + truyền dịch nếu mất nước","Cách ly, sát trùng chuồng bằng vôi bột + Virkon, chôn sâu dê chết rắc vôi"],icovet:["Ceftiofur + Ketoprofen + Gluco K-C","Vaccine tụ huyết trùng"],hanoi:["Theo Hà Nội + Thái Nguyên: Điều trị sớm khi sốt, không để chết mới điều trị, giữ ấm, giảm stress"]}),phongNgua:["Vaccine tụ huyết trùng dê/cừu 2 lần/năm tháng 3 và 9, liều 1ml/con dưới da","Giảm stress vận chuyển, che mưa nắng, không nhốt chật, bổ sung Vitamin C + ADE khi chuyển đàn","Cách ly dê mới 15 ngày, sát trùng chuồng, diệt ruồi"]}},{id:"de4",subId:"de",group:"giasuc",name:"Lở loét miệng truyền nhiễm Orf dê/cừu",sections:{gioiThieu:"Bệnh do Parapoxvirus gây mụn mủ, loét ở môi, mũi, núm vú, kẽ chân, lây lan nhanh, lây cả người (nốt Orf ở tay), dê con chết do không bú được.",nguyenNhan:"Orf virus Parapoxvirus, lây qua tiếp xúc vết trầy, vảy, tồn tại môi trường 6 tháng, đề kháng sát trùng thường, dê con bú mẹ bị lây vú mẹ.",trieuChung:["Mụn mủ ở môi trên, mép, mũi, lưỡi, sau vỡ loét đóng vảy dày màu nâu đen như đá, dê con không bú được, gầy","Vú dê mẹ cũng có mụn loét, đau không cho con bú","Kẽ chân cũng có mụn loét, què nhẹ","Lây người: tay người chăn có nốt đỏ đau, mụn mủ ở tay"],benhTich:["Môi, mũi, vú có mụn mủ, loét, vảy dày, không có bệnh tích nội tạng đặc trưng","Hạch dưới hàm sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Không bóc vảy, rửa bằng nước muối 0.9% + bôi xanh methylen 2% + glycerin + mỡ kẽm ngày 2 lần, sát trùng vết loét","Kháng sinh Pen-Strep + Ketoprofen chống bội nhiễm, Gluco K-C + ADE + cho ăn cỏ non mềm, cháo nếu đau miệng","Cách ly dê bệnh, đeo găng tay khi chăm sóc vì lây người, đốt vảy rơi, sát trùng chuồng bằng Virkon"],icovet:["Sát trùng xanh methylen + glycerin + kháng sinh chống bội nhiễm","Vaccine Orf nếu có"],hanoi:["Theo Hà Nội + Thái Nguyên: Cách ly, không bóc vảy, giữ vệ sinh, cho dê con bú bình nếu mẹ đau vú, đeo găng tay"]}),phongNgua:["Không nhập dê vùng dịch, cách ly dê mới 30 ngày, sát trùng chuồng bằng vôi + Virkon, đốt vảy","Vệ sinh máng ăn, không để trầy xước miệng, đeo găng tay khi chăm sóc dê bệnh, rửa tay xà phòng sau tiếp xúc","Vaccine Orf 1 lần/năm nếu có, bổ sung ADE + kẽm tăng đề kháng da"]}},{id:"ngua1",subId:"ngua",group:"giasuc",name:"Cảm nóng, cảm nắng ngựa",sections:{gioiThieu:"Bệnh do ngựa làm việc quá sức dưới nắng nóng >32°C, thiếu nước, chuồng nóng, bí, gây rối loạn điều hòa thân nhiệt, sốt cao, chết nhanh do suy tim.",nguyenNhan:"Nhiệt độ môi trường >32°C, ẩm >80%, làm việc nặng liên tục, thiếu nước uống, chuồng bí, không thoáng, ngựa béo, lông dày.",trieuChung:["Sốt cao 41-42°C, thở nhanh, thở bụng, tim đập nhanh 80-100 lần/phút, đổ mồ hôi nhiều sau đó không ra mồ hôi","Loạng choạng, run cơ, mắt đỏ, niêm mạc đỏ sẫm, lưỡi thè, sùi bọt mép","Nặng nằm liệt, co giật, chết sau 2-6h nếu không cấp cứu"],benhTich:["Não, phổi xung huyết, phù, tim nhão, máu đen khó đông, cơ vân hoại tử","Gan, thận xung huyết"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Đưa ngay chỗ mát, bóng cây, chuồng thoáng, tắm mát bằng nước mát 25-28°C toàn thân, chườm lạnh đầu, cho uống nước mát + muối + đường từ từ","Hạ sốt Ketoprofen 2.2mg/kg hoặc Paracetamol 10mg/kg + truyền dịch Gluco 5% + Ringer lactat + Cafein trợ tim 5ml/con","Trợ sức Vitamin C liều cao 2g + ADE + Gluco K-C, cho nghỉ 3-5 ngày, không làm việc nặng"],icovet:["Truyền dịch + hạ sốt + trợ tim","Đưa chỗ mát"],hanoi:["Theo Hà Nội + Thái Nguyên: Cho làm việc sáng sớm, chiều mát, tránh 10h-15h nắng gắt, đủ nước uống, tắm mát hàng ngày mùa nóng"]}),phongNgua:["Cho ngựa làm việc sáng sớm 5-9h và chiều mát 16-18h, tránh 10h-15h nắng gắt, đủ nước uống 30-40 lít/ngày","Chuồng thoáng mát, cao ráo, có quạt, tắm mát hàng ngày mùa nóng, bổ sung điện giải Oresol + Vitamin C mùa nóng","Không để ngựa béo quá, cắt lông mùa nóng nếu cần"]}},{id:"ngua2",subId:"ngua",group:"giasuc",name:"Đau bụng, tắc ruột ngựa",sections:{gioiThieu:"Đau bụng là hội chứng cấp tính hay gặp nhất ở ngựa do tắc ruột, xoắn ruột, liệt ruột, ăn thức ăn khô, uống ít nước, ít vận động, tỷ lệ chết 30-50% nếu xoắn ruột.",nguyenNhan:"Ăn nhiều thức ăn tinh, rơm khô, ít uống nước, ít vận động, ăn phải cát, sỏi, giun đũa nhiều tắc ruột, thay đổi thức ăn đột ngột, stress vận chuyển.",trieuChung:["Bồn chồn, nhìn bụng, cào chân, lăn lộn, lăn lưng, đổ mồ hôi, không ỉa hoặc ỉa ít phân khô","Bụng chướng, gõ kêu vang nếu tắc hơi, tim đập nhanh, thở nhanh, niêm mạc mắt đỏ sẫm nếu nặng","Nếu xoắn ruột: đau dữ dội, lăn lộn liên tục, bụng to nhanh, chết sau 12-24h"],benhTich:["Ruột tắc, chướng hơi, chứa thức ăn khô, cát, giun, xoắn ruột, ruột hoại tử tím đen nếu xoắn","Dạ dày căng to"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Cho ngựa đi lại nhẹ nhàng, không cho lăn lộn mạnh, xoa bóp bụng, thụt tháo bằng nước ấm + xà phòng 5-10 lít qua trực tràng","Cho uống dầu parafin 500ml-1 lít + Mag sulfat 200g + nước 2 lít để trơn ruột, tẩy nhẹ, nếu chướng hơi cho uống dầu ăn + bia","Giảm đau Flunixin meglumine 1.1mg/kg tĩnh mạch + Buscopan chống co thắt + truyền dịch Gluco + Ringer + Gluco K-C","Nếu xoắn ruột phải mổ cấp cứu, tẩy giun định kỳ"],icovet:["Dầu parafin + Mag sulfat + truyền dịch + giảm đau","Mổ nếu xoắn ruột"],hanoi:["Theo Hà Nội + Thái Nguyên: Cho uống đủ nước 30-40 lít/ngày, vận động hàng ngày 30 phút, không cho ăn quá nhiều tinh, cho ăn cỏ xanh + rơm"]}),phongNgua:["Cho uống đủ nước 30-40 lít/ngày, vận động hàng ngày 30 phút, không để ngựa đứng chuồng cả ngày","Cho ăn cỏ xanh 50% + rơm + tinh vừa phải, không đổi cám đột ngột, tẩy giun 3 tháng/lần bằng Ivermectin","Không cho ăn cát, đất, kiểm tra thức ăn có lẫn cát, sỏi, cho ăn đúng giờ"]}},{id:"ngua3",subId:"ngua",group:"giasuc",name:"Uốn ván ngựa",sections:{gioiThieu:"Bệnh do Clostridium tetani nhiễm qua vết thương sâu, kín, yếm khí, gây cứng hàm, co giật toàn thân, tỷ lệ chết 50-80% nếu không điều trị sớm, ngựa nhạy cảm nhất trong các gia súc.",nguyenNhan:"Clostridium tetani bào tử tồn tại trong đất, phân ngựa 10 năm, nhiễm qua vết thương sâu đinh đạp, thiến, cắt đuôi, vết cắn, vết thương kín, yếm khí.",trieuChung:["Cứng hàm, không há miệng được, không ăn được, tai dựng đứng, mắt trợn, màng mắt thứ 3 lồi, đuôi cứng","Co giật toàn thân khi có tiếng động, ánh sáng, sờ vào, cơ bắp cứng như gỗ, đứng dạng chân","Sốt nhẹ 39.5-40°C, thở nhanh, tim đập nhanh, chết do ngạt, kiệt sức sau 3-7 ngày"],benhTich:["Không có bệnh tích đặc trưng, vết thương có mủ yếm khí, cơ bắp cứng, phổi xung huyết","Dạ dày chứa thức ăn không tiêu do không nhai được"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Cách ly chỗ tối, yên tĩnh, không tiếng động, ánh sáng mạnh, cắt lọc vết thương, rửa bằng oxy già 3% + thuốc tím 0.1% để diệt yếm khí","Tiêm huyết thanh kháng độc tố uốn ván SAT 100.000-300.000 UI tĩnh mạch + bắp, Penicillin G liều cao 20.000 UI/kg 2 lần/ngày 5-7 ngày diệt vi khuẩn","An thần Diazepam 0.1mg/kg hoặc Chlorpromazine để giảm co giật + truyền dịch + Gluco K-C + cho ăn cháo loãng qua ống thông dạ dày nếu không há miệng được"],icovet:["SAT + Penicillin liều cao + an thần + chăm sóc vết thương","Giữ yên tĩnh"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ yên tĩnh tuyệt đối, không kích thích, truyền dịch, cho ăn qua ống, theo dõi thở"]}),phongNgua:["Vaccine uốn ván ngựa 2 lần/năm, liều 1ml/con tiêm bắp, vaccine Toxoid","Vệ sinh vết thương sạch, không để vết thương kín, yếm khí, rửa oxy già, bôi cồn iod, tiêm SAT phòng khi có vết thương sâu 1500-3000 UI","Chuồng sạch, khô, không để đinh, vật nhọn, dụng cụ thiến, cắt đuôi phải vô trùng"]}},{id:"cm_cho1",subId:"cho",group:"chomeo",name:"Parvo chó - Viêm ruột xuất huyết",sections:{gioiThieu:"Parvovirus type 2 gây viêm ruột xuất huyết nặng, tiêu chảy máu, nôn ói liên tục, chó con 6 tuần - 6 tháng chết 80-90% nếu không truyền dịch kịp.",nguyenNhan:"Canine Parvovirus type 2, lây phân-miệng, tồn tại môi trường 6-12 tháng, đề kháng sát trùng thường, lây qua người, giày dép.",trieuChung:["Nôn ói liên tục, bỏ ăn hoàn toàn, ủ rũ","Tiêu chảy phân đen, máu tươi tanh thối, mất nước nhanh","Sốt 40-41°C, sau hạ thân nhiệt, mắt trũng, da mất đàn hồi","Chó con 2-6 tháng dễ mắc nhất"],benhTich:["Ruột non xuất huyết nặng, thành ruột mỏng, hạch màng treo sưng to","Tim viêm cơ tim nếu chó <8 tuần, chết đột ngột"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Truyền dịch Lactate Ringer + Gluco 5% 50ml/kg/ngày, chống nôn Maropitant 1mg/kg hoặc Metoclopramide 0.2mg/kg","Kháng sinh Enrofloxacin 5mg/kg + Amoxi-clav 15mg/kg chống bội nhiễm","Trợ sức Vitamin C + K + B12 + men vi sinh sau khi hết nôn 24h","Nhịn ăn 24h đầu, sau cho ăn cháo loãng ít một"],icovet:["Vaccine 5in1, 7in1 lúc 6,9,12 tuần tuổi, nhắc lại hàng năm","Cách ly chó bệnh 14 ngày, sát trùng Virkon 1/100"],hanoi:["Theo Hà Nội + Thái Nguyên: Không tự ý cho uống sữa, giữ ấm, truyền dịch sớm là quyết định sống còn"]}),phongNgua:["Vaccine 5in1, 7in1 đủ 3 mũi lúc 6-9-12 tuần, nhắc lại hàng năm","Không cho chó con tiếp xúc chó lạ trước khi tiêm đủ, sát trùng chuồng Virkon, để trống 14 ngày"]}},{id:"cm_cho2",subId:"cho",group:"chomeo",name:"Care chó - Sốt rét chó, co giật",sections:{gioiThieu:"Distemper virus gây sốt, hô hấp, tiêu hóa, thần kinh, tỷ lệ chết 50-80%, chó con chưa tiêm dễ mắc, lây qua không khí.",nguyenNhan:"Canine Distemper virus Morbillivirus, lây không khí, dịch mũi, mắt, tồn tại môi trường lạnh 2 tuần, chó, cáo, chồn đều mắc.",trieuChung:["Sốt 40-41°C 2 pha (sốt 2 ngày hạ 5 ngày sốt lại), bỏ ăn, chảy nước mắt, nước mũi đặc xanh","Ho, khó thở, tiêu chảy","Co giật, run cơ, nhai giả, đi vòng tròn, liệt","Đệm chân, mũi dày sừng hóa, sừng hóa bàn chân"],benhTich:["Phổi viêm, não viêm không mủ, bàng quang xuất huyết, dạ dày ruột viêm","Đệm chân dày sừng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: KHÔNG có thuốc đặc trị virus, điều trị triệu chứng: kháng sinh Amoxi + Enro chống bội nhiễm phổi, hạ sốt Ketoprofen, chống co giật Diazepam 0.5mg/kg + Phenobarbital","Truyền dịch + Vitamin B1, B6, B12 liều cao hỗ trợ thần kinh","Vệ sinh mắt mũi bằng nước muối sinh lý"],icovet:["Vaccine 7in1 3 mũi","Cách ly, sát trùng"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ ấm, tăng đề kháng ADE + Vitamin C, không để chó nằm lạnh"]}),phongNgua:["Vaccine 7in1 3 mũi 6-9-12 tuần, nhắc lại hàng năm, cách ly chó mới 14 ngày, không cho tiếp xúc chó hoang"]}},{id:"cm_cho3",subId:"cho",group:"chomeo",name:"Viêm da, nấm, ghẻ chó",sections:{gioiThieu:"Bệnh da phổ biến nhất chó mèo: viêm da mủ do Staph, nấm Microsporum, ghẻ Sarcoptes, Demodex gây ngứa, rụng lông, hôi.",nguyenNhan:"Staphylococcus, nấm Microsporum canis, ghẻ Sarcoptes, Demodex, dị ứng thức ăn, ve bọ chét cắn dị ứng, ẩm ướt, thiếu kẽm, ADE.",trieuChung:["Ngứa dữ, gãi, cắn, liếm chân, rụng lông từng mảng tròn hoặc toàn thân","Da đỏ, mụn mủ, vảy gàu trắng, da dày đen (voi)","Mùi hôi tanh, viêm tai kèm theo","Ghẻ Demodex: rụng lông quanh mắt, mõm như kính"],benhTich:["Da viêm, có mủ, nấm sợi dưới kính, ghẻ đào hang, Demodex trong nang lông"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tắm bằng sữa tắm chứa Chlorhexidine + Ketoconazole 2 lần/tuần, bôi mỡ kẽm + Ketoconazole","Kháng sinh Cefalexin 20mg/kg 14-21 ngày nếu viêm mủ","Trị ghẻ: Ivermectin 0.3mg/kg tiêm SC 2 lần cách 7 ngày hoặc Nexgard/Simparica uống 1 viên","Trị nấm: Itraconazole 5mg/kg 21 ngày + tắm Nizoral","Bổ sung ADE + kẽm + Omega 3"],icovet:["Nexgard, Simparica, Bravecto định kỳ hàng tháng","Vệ sinh chỗ nằm"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ khô, không tắm quá nhiều, phơi nắng 15 phút/ngày, không cho ăn mặn, đồ tanh quá nhiều"]}),phongNgua:["Tắm 1 lần/tuần bằng sữa tắm chó mèo, sấy khô, phơi nắng, vệ sinh chỗ nằm bằng Hantox","Nexgard/Simparica định kỳ 1-3 tháng, bổ sung ADE, kẽm, Omega 3, không cho ăn đồ mặn, xương gà sắc"]}},{id:"cm_cho4",subId:"cho",group:"chomeo",name:"Ve rận, bọ chét, ký sinh trùng ngoài chó mèo",sections:{gioiThieu:"Ve Rhipicephalus, bọ chét Ctenocephalides hút máu, truyền Ehrlichia, Babesia, gây thiếu máu, ngứa, dị ứng.",nguyenNhan:"Ve, bọ chét từ môi trường cỏ, chó mèo khác, mùa nóng ẩm phát triển mạnh, vòng đời 3 tuần, trứng rơi ra nền nhà.",trieuChung:["Ngứa, gãi, ve bám ở tai, nách, bẹn, kẽ chân, bụng, hút máu căng tròn","Da mẩn đỏ dị ứng bọ chét, rụng lông lưng đuôi","Thiếu máu nếu ve nhiều: niêm mạc nhợt, gầy","Truyền bệnh máu: sốt, vàng da, tiểu đỏ nếu nhiễm Babesia"],benhTich:["Ve, bọ chét bám da, da viêm dị ứng, máu loãng nếu nhiễm ký sinh trùng máu"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Nhỏ gáy Frontline, Revolution hoặc uống Nexgard/Simparica/Bravecto 1 viên hiệu quả 1-3 tháng","Phun môi trường Hantox 1ml/2 lít, 7 ngày/lần 3 lần diệt trứng ấu trùng","Tắm sạch bằng sữa tắm trị ve","Nếu nhiễm Babesia: Diminazene 3.5mg/kg + Doxycyclin 10mg/kg 21 ngày + bổ máu"],icovet:["Bravecto 1 viên 3 tháng hoặc Nexgard hàng tháng","Vệ sinh môi trường"],hanoi:["Theo Hà Nội + Thái Nguyên: Không để chó nằm đất ẩm, cỏ rậm, cắt cỏ, phát quang, tắm định kỳ"]}),phongNgua:["Nhỏ gáy hoặc uống Nexgard/Simparica định kỳ 1-3 tháng, phun Hantox môi trường 1 tháng/lần, giữ chỗ nằm khô sạch, không thả rông tiếp xúc chó hoang"]}},{id:"cm_cho5",subId:"cho",group:"chomeo",name:"Tiêu chảy, nôn ói, Parvo-like, viêm dạ dày ruột chó mèo",sections:{gioiThieu:"Viêm dạ dày ruột do ăn bậy, đổi cám, nhiễm khuẩn E.coli, Corona, Giardia, chó mèo mọi lứa tuổi, tiêu chảy cấp.",nguyenNhan:"Ăn thức ăn ôi, xương sắc, đổi cám đột ngột, nhiễm E.coli, Salmonella, Corona virus, Giardia, stress, lạnh.",trieuChung:["Nôn ói thức ăn, bọt vàng, bỏ ăn","Tiêu chảy phân lỏng, vàng, có máu, mùi tanh","Mất nước nhẹ, mắt hơi trũng, ủ rũ","Sốt nhẹ 39.5-40°C nếu nhiễm khuẩn"],benhTich:["Dạ dày ruột viêm, xung huyết, chứa thức ăn không tiêu, xương"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Nhịn ăn 12-24h, cho uống Oresol + men vi sinh Bio + Gluco K-C","Chống nôn Maropitant 1mg/kg, kháng sinh Metronidazole 15mg/kg + Amoxi-clav nếu nhiễm khuẩn","Nếu tiêu chảy kéo dài: test Parvo/Corona bằng kit, tẩy giun bằng Drontal"],icovet:["Metronidazole + men vi sinh + Oresol","Ăn cháo gà xé loãng sau nhịn"],hanoi:["Theo Hà Nội + Thái Nguyên: Không cho ăn xương gà, cá tanh, giữ ấm bụng, không để nằm lạnh"]}),phongNgua:["Cho ăn đúng giờ, không đổi cám đột ngột, không cho ăn xương sắc, đồ ôi, tẩy giun định kỳ 3 tháng/lần, giữ ấm"]}},{id:"cm_cho6",subId:"cho",group:"chomeo",name:"Ho, hô hấp - Viêm phổi, cúm chó (Kennel cough)",sections:{gioiThieu:"Ho cũi do Bordetella + Parainfluenza gây ho khan dữ dội, lây nhanh qua không khí, chó nhốt chung, petshop.",nguyenNhan:"Bordetella bronchiseptica + Parainfluenza + Mycoplasma, lây không khí, tiếp xúc, stress vận chuyển, lạnh, bụi.",trieuChung:["Ho khan to như ngỗng kêu, ho khi kích thích cổ, ho về đêm","Chảy nước mũi, sốt nhẹ, bỏ ăn nhẹ","Thở nhanh nếu viêm phổi, tiếng ran ẩm"],benhTich:["Khí quản viêm, phổi viêm đốm nếu nặng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Doxycyclin 10mg/kg + Enrofloxacin 5mg/kg 7 ngày + Bromhexin long đờm + hạ sốt","Giữ ấm, phun sương tinh dầu tràm, tăng đề kháng Vitamin C","Nếu ho cũi: vaccine Kennel cough nhỏ mũi"],icovet:["Doxycyclin + Bromhexin","Vaccine 7in1 + Kennel cough"],hanoi:["Theo Hà Nội + Thái Nguyên: Cách ly chó ho, giữ ấm, không để gió lùa, giảm bụi"]}),phongNgua:["Vaccine 7in1 + Kennel cough hàng năm, giữ ấm, không nhốt chật, thông thoáng, cách ly chó mới 7 ngày"]}},{id:"cm_cho7",subId:"cho",group:"chomeo",name:"Bệnh về tai - Viêm tai ngoài, ve tai Otodectes",sections:{gioiThieu:"Viêm tai ngoài do vi khuẩn, nấm, ve tai Otodectes gây ngứa, hôi, lắc đầu, gãi tai, chó tai cụp dễ mắc.",nguyenNhan:"Ve tai Otodectes, nấm Malassezia, vi khuẩn Staph, Pseudomonas, tai ẩm sau tắm, lông tai rậm không nhổ.",trieuChung:["Lắc đầu, gãi tai, tai đỏ, sưng, hôi, có ráy đen như bã cà phê nếu ve tai","Nghiêng đầu, đau khi sờ tai","Chảy mủ vàng nếu viêm nặng"],benhTich:["Ống tai đỏ, có ráy đen, ve dưới kính, màng nhĩ có thể thủng nếu nặng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Vệ sinh tai bằng dung dịch Epi-Otic hoặc nước muối sinh lý, lau khô","Nhỏ tai: Otodex, Dexoryl hoặc Surolan 2 lần/ngày 7-10 ngày","Nếu ve tai: nhỏ Revolution hoặc uống Simparica, vệ sinh cả 2 tai","Kháng sinh Amoxi-clav nếu viêm mủ"],icovet:["Vệ sinh tai + nhỏ tai kháng nấm, kháng khuẩn","Cắt lông tai"],hanoi:["Theo Hà Nội + Thái Nguyên: Lau khô tai sau tắm, không để nước vào tai, nhổ lông tai định kỳ"]}),phongNgua:["Vệ sinh tai 1 lần/tuần, lau khô sau tắm, nhổ lông tai, nhỏ Revolution định kỳ trị ve tai, không để nước vào tai"]}},{id:"cm_cho8",subId:"cho",group:"chomeo",name:"Xương khớp, đi đứng, què, loạn sản hông",sections:{gioiThieu:"Chó lớn nhanh thiếu Canxi, thừa đạm, sàn trơn gây loạn sản hông, viêm khớp, què, đặc biệt Poodle, Pug, chó ta.",nguyenNhan:"Thiếu Canxi, Vitamin D, ADE, sàn trơn trượt, nhảy cao, béo phì, di truyền loạn sản hông ở chó lớn.",trieuChung:["Đi khập khiễng, không muốn đứng, nằm nhiều, kêu đau khi sờ khớp","Chân cong, vòng kiềng nếu thiếu Canxi","Loạn sản hông: đi lắc mông, khó leo cầu thang, ngồi kiểu ếch"],benhTich:["Xương mềm, khớp sưng, X-quang thấy ổ cối nông nếu loạn sản"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Bổ sung Canxi hữu cơ + Vitamin D3 + ADE B12 1 tháng, Glucosamine + Chondroitin cho khớp","Giảm đau Meloxicam 0.1mg/kg 3-5 ngày, giữ ấm khớp, không cho chạy nhảy","Nếu thiếu Canxi nặng: truyền Calci gluconate 10% chậm","Lót thảm chống trơn, giảm cân nếu béo"],icovet:["Canxi + Glucosamine + Meloxicam","X-quang khớp"],hanoi:["Theo Hà Nội + Thái Nguyên: Không nuôi sàn trơn gạch men, lót thảm, cho vận động vừa phải, không cho nhảy cao"]}),phongNgua:["Bổ sung Canxi + ADE + D3 từ 2 tháng tuổi, không nuôi sàn trơn, lót thảm, cho vận động nhẹ, không béo phì, không cho nhảy cao tầng"]}},{id:"cm_meo1",subId:"meo",group:"chomeo",name:"Giảm bạch cầu mèo - Parvo mèo (FPV)",sections:{gioiThieu:"FPV gây giảm bạch cầu, tiêu chảy máu, nôn, chết 70-90% mèo con chưa tiêm, lây phân, tồn tại môi trường 1 năm.",nguyenNhan:"Feline Panleukopenia virus, lây phân-miệng, người, bọ chét, tồn tại môi trường 1 năm, đề kháng sát trùng.",trieuChung:["Sốt 40-41°C, bỏ ăn, nôn ói liên tục, nằm gục đầu vào bát nước nhưng không uống","Tiêu chảy vàng, máu, mất nước nhanh","Giảm bạch cầu <3000, ủ rũ, chết nhanh 2-5 ngày"],benhTich:["Ruột non xuất huyết, tủy xương giảm sinh bạch cầu, hạch màng treo sưng"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Truyền dịch Lactate Ringer + Gluco 5% + chống nôn Maropitant + kháng sinh Amoxi-clav + Enro","Trợ sức Vitamin B12 + K + C + men vi sinh","Cách ly, sát trùng Virkon, giữ ấm 30°C"],icovet:["Vaccine 4in1 mèo lúc 8,12,16 tuần","Cách ly 21 ngày"],hanoi:["Theo Hà Nội + Thái Nguyên: Không tự ý cho uống sữa, giữ ấm, truyền dịch sớm"]}),phongNgua:["Vaccine 4in1 mèo 3 mũi 8-12-16 tuần, nhắc lại hàng năm, cách ly mèo mới 14 ngày, sát trùng Virkon, không thả rông"]}},{id:"cm_meo2",subId:"meo",group:"chomeo",name:"Nấm da mèo, rụng lông tròn",sections:{gioiThieu:"Nấm Microsporum canis gây rụng lông tròn, vảy gàu, ngứa nhẹ, lây người, mèo Anh lông ngắn dễ mắc.",nguyenNhan:"Nấm Microsporum, Trichophyton, ẩm ướt, thiếu kẽm, ADE, stress, lây qua tiếp xúc, lược chải.",trieuChung:["Rụng lông tròn đồng xu, vảy gàu trắng, bờ đỏ, ngứa nhẹ","Lông gãy, da đỏ, lan toàn thân nếu nặng","Lây người: đốm đỏ tròn ngứa ở tay, cổ"],benhTich:["Sợi nấm dưới kính, cạo da soi tươi"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tắm Nizoral + bôi Ketoconazole + uống Itraconazole 5mg/kg 21 ngày","Vệ sinh chỗ nằm bằng Virkon, phơi nắng, bổ sung ADE + kẽm + Omega 3","Đeo loa chống liếm, cách ly mèo bệnh"],icovet:["Itraconazole + tắm nấm","Vệ sinh môi trường"],hanoi:["Theo Hà Nội + Thái Nguyên: Giữ khô, phơi nắng 15 phút/ngày, không cho nằm ẩm, giặt khăn, ổ nằm"]}),phongNgua:["Tắm 1 lần/tuần, sấy khô, phơi nắng, vệ sinh ổ nằm, bổ sung ADE, kẽm, không nuôi quá dày, cách ly mèo mới"]}},{id:"cm_meo3",subId:"meo",group:"chomeo",name:"Sổ giun, giun đũa, sán dây chó mèo",sections:{gioiThieu:"Giun đũa Toxocara, giun móc, sán dây Dipylidium từ bọ chét gây gầy, bụng to, ỉa ra giun, sán như hạt gạo.",nguyenNhan:"Ăn phải trứng giun từ đất, bọ chét chứa ấu trùng sán, mẹ truyền qua sữa, ăn chuột, cá sống.",trieuChung:["Bụng to, gầy, lông xù, ỉa ra giun dài, sán hạt gạo bám quanh hậu môn","Nôn ra giun, tiêu chảy, thiếu máu nếu giun móc nhiều","Ngứa hậu môn, lê đít"],benhTich:["Ruột chứa nhiều giun, sán, bụng to, gan có đốm trắng di hành"],dieuTri:h({bacLieu:["Theo Bạc Liêu: Tẩy bằng Drontal, Caniverm, Sanpet 1 viên/4-5kg, lặp lại sau 14 ngày, sau đó 3 tháng/lần","Trị bọ chét kèm Nexgard/Simparica vì sán dây lây qua bọ chét","Bổ sung men vi sinh + sắt + B12 nếu thiếu máu"],icovet:["Drontal + trị bọ chét","Vệ sinh phân"],hanoi:["Theo Hà Nội + Thái Nguyên: Dọn phân hàng ngày, không cho ăn cá sống, chuột, giữ vệ sinh"]}),phongNgua:["Tẩy giun 1 tháng/lần đến 6 tháng tuổi, sau đó 3 tháng/lần, trị bọ chét định kỳ, dọn phân hàng ngày, không cho ăn đồ sống, rửa tay sau tiếp xúc"]}},{id:"cm_meo4",subId:"meo",group:"chomeo",name:"Hô hấp mèo - Calici, Herpes, chảy nước mũi",sections:{gioiThieu:"Calicivirus + Herpesvirus mèo gây hắt hơi, chảy nước mũi, loét miệng, sốt, lây nhanh qua không khí.",nguyenNhan:"Feline Calicivirus, Herpesvirus type 1, lây không
